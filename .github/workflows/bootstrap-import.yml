name: Bootstrap V4 repository import

on:
  push:
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify approved source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/parts/part-* > /tmp/stellar-wrap-source.b64
          base64 --decode /tmp/stellar-wrap-source.b64 > /tmp/stellar-wrap-source.zip
          echo '1b693687cf3d23f2712c44334790aa1f66e6c9b1e9b5171c984b02f59e3850b4  /tmp/stellar-wrap-source.zip' | sha256sum --check --strict
          rm -rf /tmp/stellar-wrap-source
          mkdir -p /tmp/stellar-wrap-source
          unzip -q /tmp/stellar-wrap-source.zip -d /tmp/stellar-wrap-source

      - name: Import source and validate
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.bootstrap/' \
            --exclude='.github/workflows/bootstrap-import.yml' \
            /tmp/stellar-wrap-source/ ./
          rm -rf .bootstrap
          npm run check

      - name: Commit imported repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'feat: import V4.0 stable simulator and project documentation'
            git push origin HEAD:main
          fi
