name: Bootstrap V4 repository import

on:
  push:
    paths:
      - '.bootstrap/READY'
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'push' || github.event.issue.title == '[bootstrap] Import V4 stable'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify approved source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/xz/part-* > /tmp/stellar-wrap-source.b64
          base64 --decode /tmp/stellar-wrap-source.b64 > /tmp/stellar-wrap-source.tar.xz
          echo 'b3fced670a82bd487649163bc841fe7f0f1e50d2d96cb018613db8804fcfc9e5  /tmp/stellar-wrap-source.tar.xz' | sha256sum --check --strict
          rm -rf /tmp/stellar-wrap-source
          mkdir -p /tmp/stellar-wrap-source
          tar -xJf /tmp/stellar-wrap-source.tar.xz -C /tmp/stellar-wrap-source

      - name: Import source and validate
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.bootstrap/' \
            --exclude='.github/workflows/' \
            /tmp/stellar-wrap-source/ ./
          rm -rf .bootstrap
          npm run check

      - name: Commit imported repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'feat: import V4.0 stable simulator and project documentation'
            git push origin HEAD:main
          fi
