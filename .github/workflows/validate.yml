name: Validate stable simulator

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source, stable baseline and route graph
        run: npm run check

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            artifacts/focus-tray-browser/
            artifacts/photo-mode-browser/
            artifacts/mode-gateway-browser/
            artifacts/frontier-destination-handoff/
            artifacts/gallery-voyage-postcards/
            artifacts/capture-gallery/
          if-no-files-found: ignore
          retention-days: 7
