function applyVista(id){const preset=VISTAS[id];if(!preset||phase!=='explore')return false;setOrbit(false);guidedVista=id;targetYaw=preset.yaw;targetPitch=preset.pitch;targetRoll=preset.roll;vistaButtons.forEach(button=>button.setAttribute('aria-pressed',button.dataset.vesperVista===id?'true':'false'));phaseMeta.textContent=`構圖導覽 · ${preset.label}`;story.textContent=preset.copy;notify(`${preset.label} · 已固定構圖`);return true}
function smooth(t){return t*t*(3-2*t)}
function setPhase(next){phase=next;phaseStarted=performance.now();if(next==='arrival'){phaseName.textContent='雲頂採集通道';phaseMeta.textContent='多層採集臂沿氣層切線展開';story.textContent='氣巨星風暴帶佔滿視野時，暮環採集場從夜側切入。發光工業環、前後錯層的採集臂／冷凝翼與四組大氣撈取索形成清楚的工業深度。'}else if(next==='explore'){phaseName.textContent='暮環自由觀測';phaseMeta.textContent='拖動畫面檢視氣層、採集臂與貨運群';story.textContent=FREE_COPY;captureButton.disabled=false;vistaRail.hidden=false}}
function update(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(hidden)return;if(phase==='approach'){const t=Math.min(1,(now-phaseStarted)/APPROACH_MS),e=smooth(t);world.position.z=-188+66*e;world.position.x=-10+8*e;planetGroup.rotation.y+=dt*.025;ring.rotation.z+=dt*.09;ringGlow.rotation.z-=dt*.055;if(t>=1)setPhase('arrival')}else if(phase==='arrival'){const t=Math.min(1,(now-phaseStarted)/(TEST_MODE?350:1500)),e=smooth(t);world.position.z=-122+18*e;refinery.position.x=-23+6*e;if(t>=1)setPhase('explore')}else{if(autoOrbit){targetYaw+=dt*.072;targetPitch=Math.sin(now*.00019)*.04;targetRoll=0}lookYaw+=(targetYaw-lookYaw)*Math.min(1,dt*5.5);lookPitch+=(targetPitch-lookPitch)*Math.min(1,dt*5.5);lookRoll+=(targetRoll-lookRoll)*Math.min(1,dt*5.5);world.rotation.y=lookYaw;world.rotation.x=lookPitch;world.rotation.z=lookRoll;planetGroup.rotation.y+=dt*.025;ring.rotation.z+=dt*.085;ringGlow.rotation.z-=dt*.05}}
function render(now=performance.now()){update(now);renderer.render(scene,camera);requestAnimationFrame(render)}requestAnimationFrame(render);
function point(e){const p=e.touches?.[0]||e;return{x:p.clientX,y:p.clientY}}
function down(e){if(phase!=='explore'||capturing)return;dragging=true;setOrbit(false);const p=point(e);lastX=dragStartX=p.x;lastY=dragStartY=p.y;dragMoved=false;canvas.classList.add('dragging')}
function move(e){if(!dragging)return;e.preventDefault();const p=point(e),total=Math.hypot(p.x-dragStartX,p.y-dragStartY);if(!dragMoved&&total>TAP_MOVE_TOLERANCE){dragMoved=true;if(guidedVista)clearVista()}if(guidedVista&&!dragMoved)return;const dx=p.x-lastX,dy=p.y-lastY;lastX=p.x;lastY=p.y;targetYaw+=dx*.0055;targetPitch=Math.max(-.34,Math.min(.34,targetPitch+dy*.0045))}
function up(){dragging=false;canvas.classList.remove('dragging')}canvas.addEventListener('pointerdown',down);addEventListener('pointermove',move,{passive:false});addEventListener('pointerup',up);canvas.addEventListener('touchstart',down,{passive:true});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',up);
vistaButtons.forEach(button=>button.addEventListener('click',()=>applyVista(button.dataset.vesperVista)));
orbitButton.addEventListener('click',()=>{if(phase!=='explore')return;const next=!autoOrbit;setOrbit(next);if(next)clearVista()});document.querySelector('#vesperModes').addEventListener('click',()=>{location.href='./index.html?landing=1'});
function notify(text){clearTimeout(toastTimer);toast.textContent=text;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
async function nextFrame(){await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))}
function vistaSettled(){return !guidedVista||(Math.abs(lookYaw-targetYaw)<=VISTA_SETTLE_EPS&&Math.abs(lookPitch-targetPitch)<=VISTA_SETTLE_EPS&&Math.abs(lookRoll-targetRoll)<=VISTA_SETTLE_EPS)}
function snapVistaToTarget(){lookYaw=targetYaw;lookPitch=targetPitch;lookRoll=targetRoll;world.rotation.y=lookYaw;world.rotation.x=lookPitch;world.rotation.z=lookRoll}
async function waitForVistaSettle(){if(!guidedVista)return true;const deadline=performance.now()+VISTA_SETTLE_MS;while(!vistaSettled()&&performance.now()<deadline){await Promise.race([new Promise(resolve=>requestAnimationFrame(resolve)),new Promise(resolve=>setTimeout(resolve,50))])}if(!vistaSettled())snapVistaToTarget();return vistaSettled()}
async function capture(download=true){if(capturing||phase!=='explore')throw new Error('capture unavailable');capturing=true;app.classList.add('capturing');captureButton.disabled=true;const before={pixelRatio:renderer.getPixelRatio(),w:canvas.width,h:canvas.height};try{const settled=await waitForVistaSettle(),captureOrientation={yaw:lookYaw,pitch:lookPitch,roll:lookRoll,targetYaw,targetPitch,targetRoll};renderer.setPixelRatio(Math.min(devicePixelRatio||1,MAX_CAPTURE_DPR));renderer.setSize(innerWidth,innerHeight,false);await nextFrame();renderer.render(scene,camera);const data=canvas.toDataURL('image/png'),bytes=Math.floor((data.length-data.indexOf(',')-1)*.75);if(download){const a=document.createElement('a');a.href=data;a.download='stellar-wrap-vesper-yard.png';a.click()}notify(`已建立 ${canvas.width} × ${canvas.height} 高畫質留影`);return{width:canvas.width,height:canvas.height,cssWidth:innerWidth,cssHeight:innerHeight,bytes,settled,orientation:captureOrientation}}finally{renderer.setPixelRatio(before.pixelRatio);renderer.setSize(innerWidth,innerHeight,false);capturing=false;app.classList.remove('capturing');captureButton.disabled=false}}
captureButton.addEventListener('click',()=>capture(true).catch(()=>notify('留影失敗，請再試一次')));document.addEventListener('visibilitychange',()=>{hidden=document.hidden;last=performance.now()});
window.WarpFrontierVesper={state(){const info=renderer.info.render;return{destination:'VESPER',phase,exploring:phase==='explore',autoOrbit,capturing,vista:guidedVista||'free',visualProfile:VESPER_DETAIL_PROFILE,harvestDetails:{stormTexture:`${STORM_TEXTURE_SIZE[0]}x${STORM_TEXTURE_SIZE[1]}`,collectorIntakes:COLLECTOR_INTAKE_COUNT,serviceLights:SERVICE_LIGHT_COUNT,harvestBooms:HARVEST_BOOM_COUNT,condenserVanes:CONDENSER_VANE_COUNT,depthSpan:HARVEST_DEPTH_SPAN,detailObjects:2,detailTriangles:HARVEST_DETAIL_TRIANGLES},orientation:{yaw:lookYaw,pitch:lookPitch,roll:lookRoll,targetYaw,targetPitch,targetRoll},cssWidth:innerWidth,cssHeight:innerHeight,backingWidth:canvas.width,backingHeight:canvas.height,pixelRatio:renderer.getPixelRatio(),drawCalls:info.calls,triangles:info.triangles}},skipArrival(){world.position.set(-2,-2,-104);refinery.position.x=-17;setPhase('explore')},applyVista(id){return applyVista(id)},capture};
app.classList.add('ready');
</script>
