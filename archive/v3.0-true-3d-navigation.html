<body>

<div id="flightBar"><div id="flightFill"></div></div>
<div id="telemetry"><div class="teleLine"><b id="teleSpeed">0.02 c</b><span id="teleTarget">等待航行指令</span></div><div id="teleHeading" class="teleLine">航向 AZ 000° · EL +00°</div></div>
<button id="openPanel" type="button">星圖 / 航行</button>

<div id="loading">正在啟動 WebGL 3D 星際引擎…<br><small>首次開啟需要網絡載入固定版本 3D 引擎。</small></div>
</div>

function updateFlight(dt){if(!flying)return;pt+=dt;const p=clamp(pt/pdur,0,1),e=smoother(p);turnAmount=0;if(phase==='turn'){shipQ.slerpQuaternions(turnFromQ,turnToQ,e);bank=Math.sin(Math.PI*p)*clamp(turnAngle*.15,0,.27)*bankSign;turnAmount=Math.sin(Math.PI*p);warpAmount=0;systemOpacity=1}else if(phase==='accelerate'){bank*=Math.pow(.02,dt);warpAmount=.78*e;systemOpacity=1-e;systemDepth=lerp(0,85,e)}else if(phase==='warp'){warpAmount=1;bgMix=e;systemOpacity=0;systemDepth=220}else if(phase==='decelerate'){warpAmount=1-e;systemOpacity=e*.7;systemDepth=lerp(260,105,e)}else if(phase==='approach'){warpAmount=0;systemOpacity=lerp(.7,1,e);systemDepth=lerp(105,0,e)}else if(phase==='observe'){warpAmount=0;systemOpacity=1;systemDepth=0}let local=0;if(phase==='accelerate')local=.025*e;if(phase==='warp')local=.025+.89*e;if(phase==='decelerate')local=.915+.045*e;if(phase==='approach')local=.96+.04*e;if(phase==='observe')local=1;const progress=(distanceBefore+segmentDistance*local)/Math.max(totalDistance,.001);E.fill.style.width=(progress*100).toFixed(1)+'%';const remaining=Math.max(0,segmentDistance*(1-local));if(phase==='warp'){E.teleSpeed.textContent=`WARP ${(4+Number(E.warp.value)*5.6).toFixed(1)}`;E.teleTarget.textContent=`餘下 ${remaining.toFixed(1)} LY · ${node(route[seg+1]).name}`}else if(phase==='accelerate')E.teleSpeed.textContent=`${lerp(.08,2.8,e).toFixed(2)} c`;else if(phase==='decelerate')E.teleSpeed.textContent=`${lerp(2.8,.12,e).toFixed(2)} c`;else if(phase==='approach')E.teleSpeed.textContent=`${lerp(.12,.02,e).toFixed(2)} c`;else E.teleSpeed.textContent='0.02 c';if(p>=1){if(phase==='turn'){shipQ.copy(turnToQ);bank=0;setPhase('accelerate')}else if(phase==='accelerate')setPhase('warp');else if(phase==='warp')setPhase('decelerate');else if(phase==='decelerate')setPhase('approach');else if(phase==='approach')setPhase('observe');else if(phase==='observe')finishSegment()}}
