<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#02040b" />
<title>星際曲速航行模擬器 V2</title>
<style>
:root{color-scheme:dark;--bg:#02040a;--panel:rgba(7,11,22,.9);--line:rgba(185,213,255,.17);--text:#f3f7ff;--muted:rgba(224,234,250,.62);--safeT:max(10px,env(safe-area-inset-top));--safeB:max(10px,env(safe-area-inset-bottom));--safeL:max(10px,env(safe-area-inset-left));--safeR:max(10px,env(safe-area-inset-right))}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans HK",sans-serif}button,input{font:inherit}button{color:inherit}
#app{position:fixed;inset:0;overflow:hidden;background:#02040a}#space{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 47%,transparent 46%,rgba(0,0,0,.18) 72%,rgba(0,0,0,.62) 100%)}
.hud{position:absolute;z-index:5;top:var(--safeT);left:var(--safeL);right:var(--safeR);pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.hudBlock{text-shadow:0 2px 12px #000;max-width:58%}.kicker{font-size:9px;letter-spacing:.16em;font-weight:800;color:rgba(232,241,255,.72)}.place{font-size:18px;font-weight:760;line-height:1.1;margin-top:4px}.sub{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.35}.phase{text-align:right;max-width:42%}.phase strong{display:block;font-size:11px;letter-spacing:.04em}.phase span{font-size:9px;color:var(--muted);line-height:1.35;display:block;margin-top:3px}
#flightBar{position:absolute;z-index:5;top:calc(var(--safeT) + 66px);left:var(--safeL);right:var(--safeR);height:3px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;opacity:.18;transition:opacity .2s}#flightBar.active{opacity:1}#flightFill{height:100%;width:0;background:linear-gradient(90deg,#7298ff,#e1ecff)}
#edgeNote{position:absolute;z-index:6;left:var(--safeL);bottom:calc(var(--safeB) + 58px);max-width:min(72vw,360px);pointer-events:none;text-shadow:0 2px 14px #000;opacity:.78;transition:opacity .25s}.edgeTitle{font-size:12px;font-weight:800;letter-spacing:.06em}.edgeSub{font-size:9px;color:rgba(228,237,252,.62);margin-top:3px;line-height:1.35}
#openPanel{position:absolute;z-index:9;right:var(--safeR);bottom:var(--safeB);height:46px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:rgba(7,11,21,.72);backdrop-filter:blur(14px);font-weight:760;font-size:12px;box-shadow:0 12px 34px rgba(0,0,0,.32)}
#panel{position:absolute;z-index:10;left:7px;right:7px;bottom:7px;max-height:min(76%,690px);overflow:auto;border:1px solid var(--line);border-radius:23px;background:var(--panel);backdrop-filter:blur(24px) saturate(130%);box-shadow:0 24px 88px rgba(0,0,0,.56);padding:13px 13px calc(13px + env(safe-area-inset-bottom));transform:translateY(calc(100% + 20px));opacity:0;transition:transform .26s cubic-bezier(.2,.8,.2,1),opacity .18s;overscroll-behavior:contain}#panel.open{transform:translateY(0);opacity:1}.panelHead{display:flex;justify-content:space-between;gap:10px;position:sticky;top:-13px;background:linear-gradient(180deg,rgba(7,11,22,.98) 78%,transparent);padding:13px 0 10px;z-index:2}.panelHead h2{font-size:15px;margin:0}.panelHead p{font-size:10px;color:var(--muted);margin:4px 0 0}.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:20px}
.mapWrap{border:1px solid var(--line);border-radius:17px;padding:7px;background:rgba(255,255,255,.024)}#map{width:100%;height:auto;display:block}.mapLink{stroke:rgba(176,203,245,.12);stroke-width:1}.mapRoute{stroke:#a9c8ff;stroke-width:2.4;stroke-dasharray:5 5;fill:none}.mapNode circle{fill:#0b1327;stroke:rgba(224,236,255,.4);stroke-width:1.1}.mapNode text{fill:rgba(235,242,255,.7);font-size:8px;text-anchor:middle;pointer-events:none}.mapNode.current circle{fill:#e5efff;stroke:#fff}.mapNode.current text{fill:#fff;font-weight:800}.mapNode.selected circle{stroke:#9fc4ff;stroke-width:3}.mapNode{cursor:pointer}
.routeCard{margin-top:9px;border:1px solid var(--line);border-radius:15px;padding:11px;background:rgba(255,255,255,.024)}.routeTop{display:flex;justify-content:space-between;gap:8px}.routeTitle{font-weight:760;font-size:13px}.routeMeta{font-size:10px;color:var(--muted);text-align:right;white-space:nowrap}.routeLine{margin-top:6px;font-size:11px;color:rgba(232,240,255,.82);line-height:1.45}.buttonRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.primary,.secondary{min-height:46px;border-radius:13px;border:1px solid var(--line);font-weight:760;font-size:12px}.primary{background:linear-gradient(180deg,rgba(159,196,255,.24),rgba(109,151,224,.12));border-color:rgba(178,211,255,.38)}.primary:disabled{opacity:.35}.secondary{background:rgba(255,255,255,.04)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.setting{border:1px solid var(--line);border-radius:13px;padding:9px;background:rgba(255,255,255,.02)}.setting label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);gap:6px}.setting output{color:var(--text);font-weight:700}.setting input{width:100%;margin-top:7px;accent-color:#aac9ff}.legend{font-size:9px;color:rgba(216,228,248,.5);line-height:1.45;margin:9px 2px 0}.journey{margin-top:9px;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.chip{flex:0 0 auto;padding:5px 8px;border-radius:999px;border:1px solid var(--line);font-size:9px;color:var(--muted)}.chip.active{color:#fff;border-color:rgba(171,205,255,.55);background:rgba(150,190,255,.12)}
@media(min-width:760px){#panel{left:auto;right:14px;width:390px;bottom:14px;max-height:84%}.place{font-size:22px}.edgeTitle{font-size:14px}}@media(prefers-reduced-motion:reduce){#panel,#edgeNote{transition:none}}
</style>
</head>
<body><div id="app"><canvas id="space" aria-label="星際曲速航行模擬器"></canvas><div class="vignette"></div>
<header class="hud"><div class="hudBlock"><div class="kicker">INTERSTELLAR NAV</div><div id="currentName" class="place">地球近軌</div><div id="coord" class="sub">SOL · X 0.0 / Y 0.0 / Z 0.0 LY</div></div><div class="hudBlock phase"><strong id="phaseName">巡航待命</strong><span id="phaseMeta">選擇目的地</span></div></header>
<div id="flightBar"><div id="flightFill"></div></div><div id="edgeNote"><div id="edgeTitle" class="edgeTitle">地球近軌</div><div id="edgeSub" class="edgeSub">藍色行星、薄大氣層與近地軌道燈火。</div></div>
<button id="openPanel" type="button">星圖 / 航行</button>
<section id="panel" aria-label="航行控制面板"><div class="panelHead"><div><h2>模擬星圖</h2><p>8 個星區具固定 3D 方位與距離。</p></div><button id="closePanel" class="close" type="button" aria-label="關閉">×</button></div><div class="mapWrap"><svg id="map" viewBox="0 0 330 220" role="img" aria-label="八個星區的模擬星圖"></svg></div><div class="routeCard"><div class="routeTop"><div><div class="routeTitle" id="destinationName">未選擇目的地</div><div class="routeLine" id="routeText">點選星圖上的星區。</div></div><div id="routeMeta" class="routeMeta">—</div></div><div id="journey" class="journey"></div><div class="buttonRow"><button id="launch" class="primary" type="button" disabled>啟動航行</button><button id="abort" class="secondary" type="button" disabled>中止航行</button></div></div><div class="settings"><div class="setting"><label><span>曲速倍率</span><output id="warpSpeedOut">1.0×</output></label><input id="warpSpeed" type="range" min="0.7" max="1.8" step="0.1" value="1.0"></div><div class="setting"><label><span>星體密度</span><output id="densityOut">72%</output></label><input id="density" type="range" min="35" max="100" step="5" value="70"></div></div><p class="legend">模擬資料：單次曲速安全距離上限 6.0 LY。航行時間按每段距離計算；中途站會先減速、觀景、按下一段真實方位轉向，再重新加速。</p></section></div>
<script>
(()=>{
const C=document.querySelector('#space'),ctx=C.getContext('2d',{alpha:false,desynchronized:true});
const E={panel:document.querySelector('#panel'),open:document.querySelector('#openPanel'),close:document.querySelector('#closePanel'),map:document.querySelector('#map'),launch:document.querySelector('#launch'),abort:document.querySelector('#abort'),currentName:document.querySelector('#currentName'),coord:document.querySelector('#coord'),phaseName:document.querySelector('#phaseName'),phaseMeta:document.querySelector('#phaseMeta'),bar:document.querySelector('#flightBar'),fill:document.querySelector('#flightFill'),edgeTitle:document.querySelector('#edgeTitle'),edgeSub:document.querySelector('#edgeSub'),dest:document.querySelector('#destinationName'),routeText:document.querySelector('#routeText'),routeMeta:document.querySelector('#routeMeta'),journey:document.querySelector('#journey'),warp:document.querySelector('#warpSpeed'),warpOut:document.querySelector('#warpSpeedOut'),density:document.querySelector('#density'),densityOut:document.querySelector('#densityOut')};
const N=[
{id:'SOL',name:'地球近軌',p:[0,0,0],m:[42,116],scene:['#02040b','#071b39','#85b9ff'],kind:'earth',desc:'藍色行星、薄大氣層與近地軌道燈火。'},
{id:'LUNA',name:'月環基地',p:[1.2,2.6,.4],m:[92,58],scene:['#02050a','#20283a','#d7deed'],kind:'moon',desc:'灰白月面、環形軌道基地與地球遠景。'},
{id:'VEGA',name:'織女星門',p:[5.4,3.0,1.4],m:[162,82],scene:['#020611','#102e66','#b8d6ff'],kind:'vega',desc:'藍白主星與巨型航行環門。'},
{id:'CYG',name:'天鵝航標',p:[9.1,5.5,2.1],m:[238,43],scene:['#03030c','#2d2057','#dfc0ff'],kind:'cyg',desc:'紫藍雙星與遠距航標陣列。'},
{id:'ORION',name:'獵戶前哨',p:[12.0,.8,3.0],m:[287,104],scene:['#05040a','#52251d','#ffd0a7'],kind:'orion',desc:'赤紅巨星映照獵戶塵埃雲。'},
{id:'TAU',name:'金牛塵海',p:[9.4,-4.2,1.6],m:[244,177],scene:['#050309','#4d244b','#ffbce1'],kind:'tau',desc:'粉紫塵海與巨大環行星。'},
{id:'SIRIUS',name:'天狼中繼站',p:[4.5,-3.6,-.8],m:[153,176],scene:['#01060b','#10414e','#c0fbff'],kind:'sirius',desc:'高亮藍白雙星與中繼站剪影。'},
{id:'PROX',name:'比鄰星港',p:[1.8,-5.4,-1.4],m:[72,191],scene:['#050303','#451d1a','#ffc2a6'],kind:'prox',desc:'暗紅矮星、星港燈帶與深空黑影。'}];
const MAX=6.0,node=id=>N.find(n=>n.id===id),D=(a,b)=>Math.hypot(a.p[0]-b.p[0],a.p[1]-b.p[1],a.p[2]-b.p[2]);
const G={};N.forEach(a=>{G[a.id]=[];N.forEach(b=>{if(a!==b&&D(a,b)<=MAX)G[a.id].push([b.id,D(a,b)])})});
let current='SOL',selected=null,route=[],flying=false,seg=0,phase='idle',pt=0,pdur=1,progress=0,W=1,H=1,dpr=1,last=performance.now(),stars=[];let bgA=node(current).scene.slice(),bgB=node(current).scene.slice(),mix=1;let yaw=0,targetYaw=0,turnStart=0,turnDelta=0,pitch=0,targetPitch=0,turnPitchStart=0,turnPitchDelta=0;let quality=1,frameEMA=16.7;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}function angWrap(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}function heading(a,b){const dx=b.p[0]-a.p[0],dy=b.p[1]-a.p[1],dz=b.p[2]-a.p[2],h=Math.hypot(dx,dy);return {yaw:Math.atan2(dy,dx),pitch:Math.atan2(dz,h)}}
function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}function mc(a,b,t){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,W<700?1.45:1.75)*quality;C.width=Math.max(1,Math.round(W*dpr));C.height=Math.max(1,Math.round(H*dpr));C.style.width=W+'px';C.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);seed()}
function seed(){const c=Math.floor(W*H/760*Number(E.density.value)/70*quality);stars=Array.from({length:Math.min(1300,Math.max(260,c))},()=>({x:(Math.random()*2-1)*1.15,y:(Math.random()*2-1)*1.15,z:Math.random(),s:.3+Math.random()*1.35,h:Math.random()}))}
function plan(fr,to){const q=new Set(N.map(n=>n.id)),d={},pr={};N.forEach(n=>d[n.id]=Infinity);d[fr]=0;while(q.size){let u=null;for(const id of q)if(u===null||d[id]<d[u])u=id;if(u===null||!isFinite(d[u]))break;q.delete(u);if(u===to)break;for(const [v,w] of G[u])if(q.has(v)&&d[u]+w<d[v]){d[v]=d[u]+w;pr[v]=u}}if(!isFinite(d[to]))return[];const r=[];for(let u=to;u;u=pr[u]){r.unshift(u);if(u===fr)break}return r}
function mapDraw(){E.map.innerHTML='';const ns='http://www.w3.org/2000/svg';for(const a of N)for(const [bid] of G[a.id])if(a.id<bid){const b=node(bid),l=document.createElementNS(ns,'line');l.setAttribute('x1',a.m[0]);l.setAttribute('y1',a.m[1]);l.setAttribute('x2',b.m[0]);l.setAttribute('y2',b.m[1]);l.setAttribute('class','mapLink');E.map.append(l)}if(route.length>1){const p=document.createElementNS(ns,'path');p.setAttribute('d',route.map((id,i)=>`${i?'L':'M'} ${node(id).m[0]} ${node(id).m[1]}`).join(' '));p.setAttribute('class','mapRoute');E.map.append(p)}N.forEach(n=>{const g=document.createElementNS(ns,'g');g.setAttribute('class','mapNode'+(n.id===current?' current':'')+(n.id===selected?' selected':''));g.setAttribute('transform',`translate(${n.m[0]} ${n.m[1]})`);const c=document.createElementNS(ns,'circle');c.setAttribute('r',n.id===current?7:5);const t=document.createElementNS(ns,'text');t.setAttribute('y',-11);t.textContent=n.name;g.append(c,t);g.addEventListener('click',()=>select(n.id));E.map.append(g)})}
function select(id){if(flying||id===current)return;selected=id;route=plan(current,id);const total=route.slice(1).reduce((s,v,i)=>s+D(node(route[i]),node(v)),0);E.dest.textContent=node(id).name;E.routeText.textContent=route.length>2?`航線：${route.map(x=>node(x).name).join(' → ')}`:`直航：${node(current).name} → ${node(id).name}`;E.routeMeta.innerHTML=`${route.length-1} 段<br>${total.toFixed(1)} LY`;E.launch.disabled=false;mapDraw();chips()}
function chips(){E.journey.innerHTML='';route.forEach((id,i)=>{const s=document.createElement('span');s.className='chip'+(flying&&i===seg?' active':'');s.textContent=node(id).name;E.journey.append(s)})}
function sceneTo(id){bgA=[...bgB];bgB=node(id).scene;mix=0}
function uiPlace(id){const n=node(id);E.currentName.textContent=n.name;E.coord.textContent=`${n.id} · X ${n.p[0].toFixed(1)} / Y ${n.p[1].toFixed(1)} / Z ${n.p[2].toFixed(1)} LY`;E.edgeTitle.textContent=n.name;E.edgeSub.textContent=n.desc}
function startTurn(from,to,isMid=false){const h=heading(node(from),node(to));turnStart=yaw;turnDelta=angWrap(h.yaw-yaw);turnPitchStart=pitch;turnPitchDelta=angWrap(h.pitch-pitch);targetYaw=h.yaw;targetPitch=h.pitch;const a=Math.max(Math.abs(turnDelta),Math.abs(turnPitchDelta));phase='turn';pt=0;pdur=.85+1.65*(a/Math.PI);E.phaseName.textContent=isMid?'轉向下一航段':'航向對準';E.phaseMeta.textContent=`轉向 ${node(to).name}`;E.edgeTitle.textContent=isMid?'中途轉向':'航向計算';E.edgeSub.textContent=`艦首正在對準 ${node(to).name}，轉向完成後自動加速。`}
function startPhase(p){phase=p;pt=0;const mult=Number(E.warp.value),a=node(route[seg]),b=node(route[seg+1]),d=D(a,b);if(p==='accelerate')pdur=1.7;if(p==='warp')pdur=(1.7+d*.72)/mult;if(p==='decelerate')pdur=1.65;if(p==='arrival')pdur=1.55;if(p==='observe')pdur=1.9;const labels={accelerate:'亞光速加速',warp:'曲速航行',decelerate:'脫離曲速 / 減速',arrival:'接近目的星區',observe:'星區觀景'};E.phaseName.textContent=labels[p]||p;E.phaseMeta.textContent=`${seg+1}/${route.length-1} · ${b.name} · ${d.toFixed(1)} LY`;if(p==='warp'){sceneTo(b.id);E.edgeTitle.textContent='曲速航行';E.edgeSub.textContent=`距離 ${d.toFixed(1)} LY · 曲速段約 ${pdur.toFixed(1)} 秒`;}if(p==='arrival'){E.edgeTitle.textContent=`接近 ${b.name}`;E.edgeSub.textContent=b.desc}}
function launch(){if(!selected||route.length<2||flying)return;flying=true;seg=0;E.launch.disabled=true;E.abort.disabled=false;E.panel.classList.remove('open');E.open.style.display='none';E.bar.classList.add('active');startTurn(route[0],route[1],false)}
function abort(){flying=false;phase='idle';E.abort.disabled=true;E.open.style.display='block';E.bar.classList.remove('active');E.phaseName.textContent='航行中止';E.phaseMeta.textContent='停留 '+node(current).name;selected=null;route=[];mapDraw();chips();E.dest.textContent='未選擇目的地';E.routeText.textContent='點選星圖上的星區。';E.routeMeta.textContent='—'}
function finishSeg(){current=route[seg+1];uiPlace(current);seg++;mapDraw();chips();if(seg>=route.length-1){flying=false;phase='idle';E.abort.disabled=true;E.open.style.display='block';E.bar.classList.remove('active');E.fill.style.width='100%';E.phaseName.textContent='已抵達';E.phaseMeta.textContent=node(current).name;E.edgeTitle.textContent='航程完成';E.edgeSub.textContent=node(current).desc;selected=null;route=[];setTimeout(()=>{E.fill.style.width='0';mapDraw();chips()},700);return}startTurn(route[seg],route[seg+1],true)}
function updateFlight(dt){if(!flying)return;pt+=dt;const p=clamp(pt/pdur,0,1);if(phase==='turn'){const e=ease(p);yaw=turnStart+turnDelta*e;pitch=turnPitchStart+turnPitchDelta*e}const base=seg/(route.length-1),frac=1/(route.length-1);let local=0;if(phase==='turn')local=.05*p;if(phase==='accelerate')local=.05+.15*p;if(phase==='warp')local=.20+.58*p;if(phase==='decelerate')local=.78+.14*p;if(phase==='arrival')local=.92+.05*p;if(phase==='observe')local=.97+.03*p;progress=base+frac*local;E.fill.style.width=(progress*100).toFixed(1)+'%';if(p>=1){if(phase==='turn'){yaw=targetYaw;pitch=targetPitch;startPhase('accelerate')}else if(phase==='accelerate')startPhase('warp');else if(phase==='warp')startPhase('decelerate');else if(phase==='decelerate')startPhase('arrival');else if(phase==='arrival')startPhase('observe');else if(phase==='observe')finishSeg()}}
function sf(){if(!flying)return .07;const t=clamp(pt/pdur,0,1);if(phase==='turn')return .035;if(phase==='accelerate')return .09+5.0*t*t;if(phase==='warp')return 7.0+2.5*Math.sin(Math.PI*t);if(phase==='decelerate')return .08+5.0*(1-t)*(1-t);if(phase==='arrival'||phase==='observe')return .035;return .07}
function bg(){const a=mc(bgA[0],bgB[0],mix),b=mc(bgA[1],bgB[1],mix);ctx.fillStyle=a;ctx.fillRect(0,0,W,H);const g=ctx.createRadialGradient(W*.48,H*.44,0,W*.48,H*.44,Math.max(W,H)*.78);g.addColorStop(0,b);g.addColorStop(.48,mc(bgA[0],bgB[0],mix));g.addColorStop(1,a);ctx.globalAlpha=.58;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
function starfield(dt){const speed=sf(),warp=phase==='warp',turn=phase==='turn';const cx=W/2+Math.sin(yaw)*W*.035,cy=H/2-Math.sin(pitch)*H*.04;for(const s of stars){const oz=s.z;s.z-=dt*speed*.21;if(s.z<=.012){s.z=1;s.x=(Math.random()*2-1)*1.12;s.y=(Math.random()*2-1)*1.12;s.s=.3+Math.random()*1.35}const f=1/(s.z*.78+.06),pf=1/(Math.min(1,oz)*.78+.06);let ox=cx+s.x*W*.37*f,oy=cy+s.y*H*.37*f,px=cx+s.x*W*.37*pf,py=cy+s.y*H*.37*pf;if(turn){const a=turnDelta*.18*(1-clamp(pt/pdur,0,1));const dx=ox-cx,dy=oy-cy;ox=cx+dx*Math.cos(a)-dy*Math.sin(a);oy=cy+dx*Math.sin(a)+dy*Math.cos(a)}if(ox<-70||ox>W+70||oy<-70||oy>H+70)continue;const br=Math.min(1,.16+(1-s.z)*.9);ctx.globalAlpha=br*(warp?.76:.68);ctx.strokeStyle=mc('#9db9e8',bgB[2],.42+s.h*.46);ctx.lineWidth=Math.max(.45,s.s*(warp?1.05:.72));const trail=warp?4.6:(phase==='accelerate'||phase==='decelerate'?1.8:(turn?.9:.25));ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+(ox-px)*trail,oy+(oy-py)*trail);ctx.stroke();if(!warp&&s.z>.16){ctx.globalAlpha=br*.64;ctx.fillStyle='#f2f7ff';ctx.beginPath();ctx.arc(ox,oy,Math.max(.3,s.s*(1-s.z)*.62),0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1}
function circleGlow(x,y,r,c){const g=ctx.createRadialGradient(x-r*.28,y-r*.28,r*.08,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.13,c);g.addColorStop(.72,c);g.addColorStop(1,'rgba(0,0,0,.02)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function landmark(){if(flying&&(phase==='accelerate'||phase==='warp'||phase==='decelerate'))return;const n=node(current),k=n.kind,t=performance.now()/1000;ctx.save();if(k==='earth'){const r=Math.min(W,H)*.18,x=W*.73,y=H*.54;circleGlow(x,y,r,'#2b6bb9');ctx.strokeStyle='rgba(126,203,255,.34)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r*1.035,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=.35;ctx.fillStyle='#77a96b';ctx.beginPath();ctx.ellipse(x-r*.2,y-r*.08,r*.35,r*.18,-.5,0,Math.PI*2);ctx.fill()}else if(k==='moon'){const r=Math.min(W,H)*.16,x=W*.71,y=H*.55;circleGlow(x,y,r,'#8a8d98');ctx.strokeStyle='rgba(218,230,255,.33)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,r*1.35,r*.42,.18,0,Math.PI*2);ctx.stroke();circleGlow(W*.18,H*.25,r*.24,'#2f6eae')}else if(k==='vega'){circleGlow(W*.68,H*.45,Math.min(W,H)*.105,'#9bc9ff');ctx.strokeStyle='rgba(158,207,255,.52)';ctx.lineWidth=3;for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(W*.49,H*.51,Math.min(W,H)*(.17+i*.035),Math.min(W,H)*(.05+i*.01),-.25,0,Math.PI*2);ctx.stroke()}}else if(k==='cyg'){circleGlow(W*.68,H*.43,Math.min(W,H)*.085,'#c5d8ff');circleGlow(W*.32,H*.62,Math.min(W,H)*.052,'#d0b8ff');ctx.strokeStyle='rgba(215,230,255,.34)';ctx.beginPath();ctx.moveTo(W*.15,H*.75);ctx.lineTo(W*.33,H*.59);ctx.lineTo(W*.47,H*.64);ctx.stroke()}else if(k==='orion'){circleGlow(W*.72,H*.46,Math.min(W,H)*.135,'#d36d43');ctx.globalAlpha=.25;ctx.fillStyle='#a75438';for(let i=0;i<6;i++){ctx.beginPath();ctx.ellipse(W*(.2+i*.09),H*(.58+Math.sin(i)*.05),W*.18,H*.07,.2,0,Math.PI*2);ctx.fill()}}else if(k==='tau'){const r=Math.min(W,H)*.13,x=W*.67,y=H*.5;circleGlow(x,y,r,'#a779b5');ctx.strokeStyle='rgba(255,208,236,.42)';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(x,y,r*1.7,r*.42,-.22,0,Math.PI*2);ctx.stroke()}else if(k==='sirius'){circleGlow(W*.64,H*.43,Math.min(W,H)*.11,'#aeeaff');circleGlow(W*.78,H*.58,Math.min(W,H)*.05,'#e6f6ff');ctx.fillStyle='rgba(190,220,235,.28)';ctx.fillRect(W*.18,H*.68,W*.23,3);ctx.fillRect(W*.26,H*.63,3,H*.08)}else if(k==='prox'){circleGlow(W*.69,H*.47,Math.min(W,H)*.11,'#b4513f');ctx.strokeStyle='rgba(255,167,139,.25)';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(W*.25+i*W*.09,H*.68+Math.sin(t+i)*3,8+i*2,0,Math.PI*2);ctx.stroke()}}ctx.restore()}
function frame(ts){const raw=Math.min(40,(ts-last)||16.7);last=ts;frameEMA=frameEMA*.94+raw*.06;const dt=raw/1000;if(frameEMA>22&&quality>.78){quality=.78;resize()}else if(frameEMA<18&&quality<1){quality=1;resize()}updateFlight(dt);mix=Math.min(1,mix+dt*.5);bg();starfield(dt);landmark();requestAnimationFrame(frame)}
function pointer(e){if(flying)return;const nx=(e.clientX/W-.5)*2,ny=(e.clientY/H-.5)*2;targetYaw=nx*.7;targetPitch=-ny*.35;yaw+=(targetYaw-yaw)*.18;pitch+=(targetPitch-pitch)*.18}
C.addEventListener('pointermove',pointer);C.addEventListener('pointerdown',pointer);E.open.addEventListener('click',()=>E.panel.classList.add('open'));E.close.addEventListener('click',()=>E.panel.classList.remove('open'));E.launch.addEventListener('click',launch);E.abort.addEventListener('click',abort);E.warp.addEventListener('input',()=>E.warpOut.textContent=Number(E.warp.value).toFixed(1)+'×');E.density.addEventListener('input',()=>{E.densityOut.textContent=E.density.value+'%';seed()});addEventListener('resize',resize,{passive:true});
resize();mapDraw();chips();uiPlace(current);requestAnimationFrame(frame);
})();
