function move(e){if(!dragging)return;e.preventDefault();const p=point(e),total=Math.hypot(p.x-dragStartX,p.y-dragStartY);if(!dragMoved&&total>TAP_MOVE_TOLERANCE){dragMoved=true;if(guidedVista)clearVista()}if(guidedVista&&!dragMoved)return;const dx=p.x-lastX,dy=p.y-lastY;lastX=p.x;lastY=p.y;targetYaw+=dx*.0048;targetPitch=Math.max(-.42,Math.min(.42,targetPitch+dy*.0036))}
function up(){dragging=false;canvas.classList.remove('dragging')}canvas.addEventListener('pointerdown',down);addEventListener('pointermove',move,{passive:false});addEventListener('pointerup',up);canvas.addEventListener('touchstart',down,{passive:true});canvas.addEventListener('touchmove',move,{passive:false});addEventListener('touchend',up);
vistaButtons.forEach(button=>button.addEventListener('click',()=>applyVista(button.dataset.eidolonVista)));
orbitButton.addEventListener('click',()=>{if(phase!=='explore')return;const next=!autoOrbit;setOrbit(next);if(next)clearVista()});document.querySelector('#eidolonModes').addEventListener('click',()=>location.href='./?landing=1');
function notify(text){clearTimeout(toastTimer);toast.textContent=text;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1900)}async function nextFrame(){await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))}
function vistaSettled(){return !guidedVista||(Math.abs(lookYaw-targetYaw)<=VISTA_SETTLE_EPS&&Math.abs(lookPitch-targetPitch)<=VISTA_SETTLE_EPS&&Math.abs(lookRoll-targetRoll)<=VISTA_SETTLE_EPS)}
function snapVistaToTarget(){lookYaw=targetYaw;lookPitch=targetPitch;lookRoll=targetRoll;world.rotation.y=lookYaw;world.rotation.x=lookPitch;world.rotation.z=lookRoll}
async function waitForVistaSettle(){if(!guidedVista)return true;const deadline=performance.now()+VISTA_SETTLE_MS;while(!vistaSettled()&&performance.now()<deadline){await Promise.race([new Promise(resolve=>requestAnimationFrame(resolve)),new Promise(resolve=>setTimeout(resolve,50))])}if(!vistaSettled())snapVistaToTarget();return vistaSettled()}
async function capture(download=true){if(capturing||phase!=='explore')throw new Error('capture unavailable');capturing=true;app.classList.add('capturing');captureButton.disabled=true;const before={pixelRatio:renderer.getPixelRatio(),w:canvas.width,h:canvas.height};try{const settled=await waitForVistaSettle(),captureOrientation={yaw:lookYaw,pitch:lookPitch,roll:lookRoll,targetYaw,targetPitch,targetRoll};renderer.setPixelRatio(Math.min(devicePixelRatio||1,MAX_CAPTURE_DPR));renderer.setSize(innerWidth,innerHeight,false);await nextFrame();renderer.render(scene,camera);const data=canvas.toDataURL('image/png'),bytes=Math.floor((data.length-data.indexOf(',')-1)*.75);if(download){const a=document.createElement('a');a.href=data;a.download='stellar-wrap-eidolon-gate.png';a.click()}notify(`已建立 ${canvas.width} × ${canvas.height} 高畫質留影`);return{width:canvas.width,height:canvas.height,cssWidth:innerWidth,cssHeight:innerHeight,bytes,settled,orientation:captureOrientation}}finally{renderer.setPixelRatio(before.pixelRatio);renderer.setSize(innerWidth,innerHeight,false);capturing=false;app.classList.remove('capturing');captureButton.disabled=false}}
captureButton.addEventListener('click',()=>capture(true).catch(()=>notify('留影失敗，請再試一次')));document.addEventListener('visibilitychange',()=>{hidden=document.hidden;last=performance.now()});
window.WarpFrontierEidolon={state(){const info=renderer.info.render;return{destination:'EIDOLON',phase,exploring:phase==='explore',autoOrbit,capturing,vista:guidedVista||'free',visualId:EIDOLON_DETAIL_PROFILE,detailProfile:EIDOLON_DETAIL_PROFILE,memoryRibs:MEMORY_RIB_COUNT,sigilNodes:SIGIL_NODE_COUNT,riftSegments:RIFT_SEGMENT_COUNT,rift:true,orientation:{yaw:lookYaw,pitch:lookPitch,roll:lookRoll,targetYaw,targetPitch,targetRoll},cssWidth:innerWidth,cssHeight:innerHeight,backingWidth:canvas.width,backingHeight:canvas.height,pixelRatio:renderer.getPixelRatio(),drawCalls:info.calls,triangles:info.triangles}},skipArrival(){world.position.set(0,-1,-72);setPhase('explore')},applyVista(id){return applyVista(id)},capture};app.classList.add('ready');
</script>
