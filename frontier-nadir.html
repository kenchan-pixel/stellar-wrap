<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#010204">
<title>NADIR WELL｜固定黑洞景觀 · Stellar Wrap</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010204}#nadirApp{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 44%,#05070d,#010204 68%,#000 100%)}#nadirSpace{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 42%,rgba(0,0,0,.18) 68%,rgba(0,0,0,.78) 100%)}#nadirLoading{position:absolute;inset:0;display:grid;place-items:center;background:#010204;color:rgba(225,239,255,.7);font:10px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans HK",sans-serif;letter-spacing:.08em;transition:opacity .25s}.ready #nadirLoading{opacity:0;pointer-events:none}@media(prefers-reduced-motion:reduce){#nadirLoading{transition:none}}
</style>
</head>
<body>
<div id="nadirApp"><canvas id="nadirSpace" aria-label="NADIR WELL 固定黑洞景觀：事件視界、光子環、引力透鏡與吸積盤"></canvas><div class="vignette"></div><div id="nadirLoading">正在建立 NADIR 引力井…</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';

const app=document.querySelector('#nadirApp');
const canvas=document.querySelector('#nadirSpace');
const MAX_NORMAL_DPR=1.25;
const MAX_CAPTURE_DPR=1.60;
const TEST_MODE=new URLSearchParams(location.search).get('test')==='1';
const APPROACH_MS=TEST_MODE?900:5600;
const ARRIVAL_MS=TEST_MODE?260:1050;
const VISUAL_ID='NADIR_FIXED_LENSING_V2';
let phase='approach';
let phaseStarted=performance.now();
let capturing=false;
let hidden=document.hidden;
let last=performance.now();
let frameId=0;

const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false,powerPreference:'high-performance',stencil:false,depth:true,preserveDrawingBuffer:false});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.16;
renderer.setClearColor(0x010204,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,700);
camera.position.set(0,0,62);

function seeded(seed){return()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296)}
const rnd=seeded(90471);
function glowTexture(){
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,1,64,64,63);
  g.addColorStop(0,'rgba(255,248,230,1)');
  g.addColorStop(.12,'rgba(255,198,112,.82)');
  g.addColorStop(.42,'rgba(255,104,42,.18)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const glow=glowTexture();

function buildStarField(){
  const count=760,p=new Float32Array(count*3),col=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const z=-30-rnd()*280;
    p[i*3]=(rnd()-.5)*150;
    p[i*3+1]=(rnd()-.5)*180;
    p[i*3+2]=z;
    const c=.48+rnd()*.52, warm=rnd()>.88;
    col[i*3]=c*(warm?1:.72);col[i*3+1]=c*(warm?.82:.84);col[i*3+2]=c*(warm?.66:1);
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:.58,vertexColors:true,transparent:true,opacity:.78,depthWrite:false,sizeAttenuation:true});
  scene.add(new THREE.Points(g,m));
}
buildStarField();

const hero=new THREE.Group();hero.position.set(0,2,-30);hero.scale.setScalar(.68);scene.add(hero);
const blackHole=new THREE.Group();hero.add(blackHole);

const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,color:0xff8e45,transparent:true,opacity:.12,blending:THREE.AdditiveBlending,depthWrite:false}));
halo.scale.set(39,28,1);halo.position.z=-2.5;blackHole.add(halo);

const diskUniforms={time:{value:0}};
const diskMaterial=new THREE.ShaderMaterial({
  uniforms:diskUniforms,transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
  vertexShader:`varying vec2 vLocal;void main(){vLocal=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`precision highp float;varying vec2 vLocal;uniform float time;void main(){
    float r=length(vLocal);float a=atan(vLocal.y,vLocal.x);
    float edge=smoothstep(6.35,6.9,r)*(1.0-smoothstep(16.2,17.0,r));
    float filament=.54+.24*sin(r*4.8+a*11.0-time*.65)+.14*sin(r*9.3-a*17.0+time*.42);
    filament=clamp(filament,.12,1.0);
    float hot=1.0-smoothstep(6.6,14.8,r);
    float doppler=.5+.5*cos(a-3.14159);
    vec3 warm=mix(vec3(.72,.075,.018),vec3(1.0,.42,.075),hot);
    vec3 blue=vec3(.73,.9,1.0);
    vec3 color=mix(warm,blue,smoothstep(.57,.94,doppler)*(.34+.66*hot));
    float alpha=edge*filament*(.34+.52*hot)*(.58+.42*doppler);
    gl_FragColor=vec4(color,alpha);
  }`
});
const disk=new THREE.Mesh(new THREE.RingGeometry(6.35,17.0,192,1),diskMaterial);
disk.rotation.x=1.17;disk.rotation.z=-.055;disk.position.z=-.45;disk.renderOrder=1;blackHole.add(disk);

const lensMaterial=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
  vertexShader:`varying vec2 vLocal;void main(){vLocal=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`precision highp float;varying vec2 vLocal;void main(){
    float r=length(vLocal);float a=atan(vLocal.y,vLocal.x);
    float radial=smoothstep(5.82,6.15,r)*(1.0-smoothstep(7.45,7.9,r));
    float vertical=pow(abs(sin(a)),4.2);
    float side=.5+.5*cos(a-3.14159);
    vec3 amber=vec3(1.0,.31,.055),whiteBlue=vec3(.78,.92,1.0);
    vec3 color=mix(amber,whiteBlue,smoothstep(.55,.95,side));
    float alpha=radial*vertical*(.38+.55*side);
    gl_FragColor=vec4(color,alpha);
  }`
});
const lensedBackArc=new THREE.Mesh(new THREE.RingGeometry(5.82,7.9,192,1),lensMaterial);
lensedBackArc.position.z=-.9;lensedBackArc.renderOrder=2;blackHole.add(lensedBackArc);

const photonRing=new THREE.Mesh(new THREE.TorusGeometry(6.02,.105,6,176),new THREE.MeshBasicMaterial({color:0xffe3a7,transparent:true,opacity:.88,blending:THREE.AdditiveBlending,depthWrite:false}));
photonRing.position.z=.1;photonRing.renderOrder=3;blackHole.add(photonRing);

const shadow=new THREE.Mesh(new THREE.SphereGeometry(5.78,48,32),new THREE.MeshBasicMaterial({color:0x000000}));
shadow.renderOrder=4;blackHole.add(shadow);

const crescentMaterial=new THREE.MeshBasicMaterial({color:0xc8efff,transparent:true,opacity:.64,blending:THREE.AdditiveBlending,depthWrite:false});
const dopplerCrescent=new THREE.Mesh(new THREE.TorusGeometry(6.12,.19,6,58,Math.PI*.78),crescentMaterial);
dopplerCrescent.rotation.z=Math.PI*.62;dopplerCrescent.position.z=.22;dopplerCrescent.renderOrder=5;blackHole.add(dopplerCrescent);

function buildLensedStars(){
  const count=150,p=new Float32Array(count*3),col=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const upper=i<count/2;
    const t=(i%(count/2))/(count/2-1);
    const a=(upper?.12:Math.PI+.12)+t*(Math.PI-.24);
    const radius=8.2+rnd()*7.2;
    p[i*3]=Math.cos(a)*radius*(1+.09*Math.sin(t*13));
    p[i*3+1]=Math.sin(a)*radius*.58;
    p[i*3+2]=-1.7-rnd()*1.4;
    const c=.62+rnd()*.38;col[i*3]=c*.82;col[i*3+1]=c*.9;col[i*3+2]=c;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:.42,vertexColors:true,transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
  const points=new THREE.Points(g,m);points.rotation.z=-.045;blackHole.add(points);
}
buildLensedStars();

const station=new THREE.Group();station.position.set(-11.2,-12.2,3.4);station.rotation.set(.34,.58,-.22);hero.add(station);
const stationRing=new THREE.Mesh(new THREE.TorusGeometry(3.25,.34,6,64),new THREE.MeshStandardMaterial({color:0x425261,metalness:.88,roughness:.34,emissive:0x071b23,emissiveIntensity:.55}));station.add(stationRing);
const stationGlow=new THREE.Mesh(new THREE.TorusGeometry(3.25,.055,4,64),new THREE.MeshBasicMaterial({color:0x81dfff,transparent:true,opacity:.62,blending:THREE.AdditiveBlending,depthWrite:false}));station.add(stationGlow);
const spine=new THREE.Mesh(new THREE.BoxGeometry(.34,1.1,6.4),new THREE.MeshStandardMaterial({color:0x566776,metalness:.84,roughness:.35,emissive:0x07161d,emissiveIntensity:.45}));spine.rotation.x=Math.PI/2;station.add(spine);
const podGeo=new THREE.BoxGeometry(.42,.68,1.08),podMat=new THREE.MeshStandardMaterial({color:0x607585,metalness:.78,roughness:.36,emissive:0x073041,emissiveIntensity:.5}),pods=new THREE.InstancedMesh(podGeo,podMat,8),dummy=new THREE.Object3D();
for(let i=0;i<8;i++){const a=i/8*Math.PI*2;dummy.position.set(Math.cos(a)*3.25,Math.sin(a)*3.25,0);dummy.rotation.set(0,0,a);dummy.updateMatrix();pods.setMatrixAt(i,dummy.matrix)}station.add(pods);
scene.add(new THREE.AmbientLight(0x25364a,.34));const stationRim=new THREE.DirectionalLight(0xbde8ff,1.15);stationRim.position.set(-4,3,6);scene.add(stationRim);

function fit(pixelRatio=Math.min(devicePixelRatio||1,MAX_NORMAL_DPR)){
  renderer.setPixelRatio(pixelRatio);renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
}
addEventListener('resize',()=>fit());fit();

function smooth(t){return t*t*(3-2*t)}
function settleFinal(){hero.position.set(0,2,0);hero.scale.setScalar(1);phase='explore';phaseStarted=performance.now()}
function update(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;if(hidden)return;
  diskUniforms.time.value=now*.001;
  if(phase==='approach'){
    const t=Math.min(1,(now-phaseStarted)/APPROACH_MS),e=smooth(t);hero.position.z=-30+24*e;hero.scale.setScalar(.68+.24*e);if(t>=1){phase='arrival';phaseStarted=now}
  }else if(phase==='arrival'){
    const t=Math.min(1,(now-phaseStarted)/ARRIVAL_MS),e=smooth(t);hero.position.z=-6+6*e;hero.scale.setScalar(.92+.08*e);if(t>=1)settleFinal();
  }
}
function render(now=performance.now()){update(now);renderer.render(scene,camera);frameId=requestAnimationFrame(render)}
frameId=requestAnimationFrame(render);
requestAnimationFrame(()=>app.classList.add('ready'));

document.addEventListener('visibilitychange',()=>{hidden=document.hidden;last=performance.now()});
function nextFrame(){return new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))}
async function capture(download=true){
  if(phase!=='explore'||capturing)throw new Error('capture unavailable');capturing=true;
  const previous=renderer.getPixelRatio();
  try{
    fit(Math.max(previous,Math.min(devicePixelRatio||1,MAX_CAPTURE_DPR)));
    await nextFrame();renderer.render(scene,camera);
    const width=canvas.width,height=canvas.height;
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error('PNG export failed')),'image/png'));
    if(download){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`stellar-wrap-nadir-fixed-${Date.now()}.png`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),0)}
    return{width,height,blobSize:blob.size};
  }finally{fit(previous);capturing=false}
}
function state(){
  return{phase,autoOrbit:false,vista:'overview',capturing,visualId:VISUAL_ID,fixed:true,jets:false,eventHorizon:true,photonRing:true,lensedBackArc:true,dopplerAsymmetry:true,backingWidth:canvas.width,backingHeight:canvas.height,pixelRatio:renderer.getPixelRatio(),drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles};
}
function applyVista(id){return id==='overview'}
function skipArrival(){settleFinal();return true}
window.WarpFrontierNadir={state,applyVista,skipArrival,capture};
addEventListener('pagehide',()=>{cancelAnimationFrame(frameId);glow.dispose();renderer.dispose()},{once:true});
</script>
</body>
</html>
