<body>
<div id="nadirApp">
<canvas id="nadirSpace" aria-label="NADIR WELL 玄淵觀測站原創黑洞前線 3D 景觀"></canvas><div class="vignette"></div><div class="scan"></div>
<header class="head ui"><div><div class="kicker">FRONTIER FICTION · EXTREME-OBJECT EXPEDITION</div><div class="name">NADIR WELL｜玄淵觀測站</div><div class="sub">黑洞前線 · 引力透鏡環 · 無人觀測陣列 · 非 Real Space 航線</div></div><div class="phase"><b id="nadirPhaseName">引力邊界接近</b><span id="nadirPhaseMeta">吸積盤正由星海中浮現</span></div></header>
<section class="story ui"><strong>玄淵觀測站</strong><p id="nadirStoryCopy">一座繞行極端引力井的無人觀測陣列。接近時先看到被扭曲成弧的冷藍星光；抵達後，赤金吸積盤、雙向噴流與分段觀測環會把黑暗本身勾勒出來。</p><div id="nadirVistaRail" class="nadirVistaRail" aria-label="玄淵觀測站構圖導覽" hidden><button type="button" data-nadir-vista="overview" aria-pressed="false">引力井全景</button><button type="button" data-nadir-vista="station" aria-pressed="false">觀測環切線</button><button type="button" data-nadir-vista="jet" aria-pressed="false">噴流軸線</button></div><em>ORIGINAL FRONTIER FICTION · NADIR-02</em></section>
<nav class="controls ui" aria-label="玄淵觀測站操作"><button id="nadirModes" type="button">模式選擇</button><button id="nadirAurelia" type="button">AURELIA</button><button id="nadirOrbit" type="button" aria-pressed="true">自動環繞：開</button><button id="nadirCapture" class="primary" type="button" disabled>高畫質留影</button></nav>
<div id="nadirToast" role="status" aria-live="polite"></div><div id="nadirLoading">正在建立極端天體前線…<br><small>程序化 3D · 單一 renderer · 無外部圖像資產</small></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';
const app=document.querySelector('#nadirApp'),canvas=document.querySelector('#nadirSpace'),phaseName=document.querySelector('#nadirPhaseName'),phaseMeta=document.querySelector('#nadirPhaseMeta'),storyCopy=document.querySelector('#nadirStoryCopy'),orbitButton=document.querySelector('#nadirOrbit'),captureButton=document.querySelector('#nadirCapture'),toast=document.querySelector('#nadirToast'),vistaRail=document.querySelector('#nadirVistaRail'),vistaButtons=[...document.querySelectorAll('[data-nadir-vista]')];
const MAX_NORMAL_DPR=1.25,MAX_CAPTURE_DPR=1.60,NEUTRAL_WELL_ROLL=.08,TEST_MODE=new URLSearchParams(location.search).get('test')==='1',APPROACH_MS=TEST_MODE?1200:7800;

const VISTAS={
  overview:{label:'引力井全景',yaw:-.04,pitch:.02,roll:NEUTRAL_WELL_ROLL,copy:'把事件視界、雙層吸積盤、冷藍透鏡環與觀測站同時收進直向畫面，保留最完整的極端天體尺度。'},
  station:{label:'觀測環切線',yaw:-.34,pitch:.09,roll:-.28,copy:'沿觀測環切線望向引力井，金色吸積盤與冷藍站體形成前後交錯，突出「在危險邊界工作」的距離感。'},
  jet:{label:'噴流軸線',yaw:.27,pitch:-.23,roll:.42,copy:'把雙向噴流拉成畫面主軸，讓黑色事件視界與透鏡環成為中央負空間，適合高對比留影。'}

let phase='approach',phaseStarted=performance.now(),autoOrbit=true,capturing=false,hidden=document.hidden,last=performance.now(),toastTimer=0,targetYaw=0,targetPitch=0,lookYaw=0,lookPitch=0,dragging=false,lastX=0,lastY=0,guidedVista='',targetWellRoll=null;
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false,powerPreference:'high-performance',stencil:false,depth:true,preserveDrawingBuffer:false});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.setClearColor(0x02040a,1);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x020711,.0035);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1500);scene.add(new THREE.AmbientLight(0x36527a,.35));const rimLight=new THREE.DirectionalLight(0xa9dfff,1.15);rimLight.position.set(-2,1,1);scene.add(rimLight);

function seeded(seed){return()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296)}const rnd=seeded(73109);
function glowTexture(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,1,64,64,63);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.18,'rgba(170,235,255,.82)');g.addColorStop(.48,'rgba(64,148,255,.2)');g.addColorStop(1,'rgba(10,40,120,0)');x.fillStyle=g;x.fillRect(0,0,128,128);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}const glow=glowTexture();
function stars(){const count=1050,p=new Float32Array(count*3),col=new Float32Array(count*3);for(let i=0;i<count;i++){const z=-70-rnd()*900,s=Math.max(70,Math.abs(z)*.72);p[i*3]=(rnd()-.5)*s*2;p[i*3+1]=(rnd()-.5)*s;p[i*3+2]=z;const c=.62+rnd()*.38;col[i*3]=c*.72;col[i*3+1]=c*.86;col[i*3+2]=c}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:.68,vertexColors:true,transparent:true,opacity:.82,depthWrite:false,sizeAttenuation:true})))}stars();
const voidMesh=new THREE.Mesh(new THREE.SphereGeometry(7.4,36,22),new THREE.MeshBasicMaterial({color:0x000000}));well.add(voidMesh);
const diskOuter=new THREE.Mesh(new THREE.TorusGeometry(13.5,2.25,10,144),new THREE.MeshBasicMaterial({color:0xffa85a,transparent:true,opacity:.62,blending:THREE.AdditiveBlending,depthWrite:false}));diskOuter.scale.set(1,.34,1);well.add(diskOuter);
const diskInner=new THREE.Mesh(new THREE.TorusGeometry(10.2,1.25,8,128),new THREE.MeshBasicMaterial({color:0xffe0a6,transparent:true,opacity:.83,blending:THREE.AdditiveBlending,depthWrite:false}));diskInner.scale.set(1,.28,1);well.add(diskInner);
for(const [r,c,o] of [[16.4,0x66ddff,.26],[18.2,0x8278ff,.18],[20.1,0x5cbcff,.12]]){const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.13,6,128),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false}));ring.rotation.z=.08;well.add(ring)}
const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,color:0x55bfff,transparent:true,opacity:.27,blending:THREE.AdditiveBlending,depthWrite:false}));halo.scale.set(48,48,1);well.add(halo);
const jetMat=new THREE.MeshBasicMaterial({color:0x6fe7ff,transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});const jetGeo=new THREE.ConeGeometry(2.3,42,12,1,true);const jetA=new THREE.Mesh(jetGeo,jetMat),jetB=jetA.clone();jetA.position.y=24;jetB.position.y=-24;jetB.rotation.z=Math.PI;well.add(jetA,jetB);
const station=new THREE.Group();station.position.set(-21,9,5);station.rotation.set(.4,.7,.2);world.add(station);const stationRing=new THREE.Mesh(new THREE.TorusGeometry(7.4,.72,8,72),new THREE.MeshStandardMaterial({color:0x667c8e,metalness:.82,roughness:.31,emissive:0x0a3045,emissiveIntensity:.65}));station.add(stationRing);const stationGlow=new THREE.Mesh(new THREE.TorusGeometry(7.4,.1,5,72),new THREE.MeshBasicMaterial({color:0x69e6ff,transparent:true,opacity:.78,blending:THREE.AdditiveBlending,depthWrite:false}));station.add(stationGlow);
const podGeo=new THREE.BoxGeometry(.7,1.3,2.2),podMat=new THREE.MeshStandardMaterial({color:0x7a8e9e,metalness:.72,roughness:.36,emissive:0x06364a,emissiveIntensity:.6}),pods=new THREE.InstancedMesh(podGeo,podMat,10),dummy=new THREE.Object3D();for(let i=0;i<10;i++){const a=i/10*Math.PI*2;dummy.position.set(Math.cos(a)*7.4,Math.sin(a)*7.4,0);dummy.rotation.set(0,0,a);dummy.updateMatrix();pods.setMatrixAt(i,dummy.matrix)}station.add(pods);
const debrisCount=90,debrisPos=new Float32Array(debrisCount*3);for(let i=0;i<debrisCount;i++){const a=rnd()*Math.PI*2,r=27+rnd()*28;debrisPos[i*3]=Math.cos(a)*r;debrisPos[i*3+1]=(rnd()-.5)*14;debrisPos[i*3+2]=Math.sin(a)*r*.72}const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(debrisPos,3));world.add(new THREE.Points(dg,new THREE.PointsMaterial({map:glow,color:0x9adfff,size:1.1,transparent:true,opacity:.48,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true})));
function fit(){const dpr=Math.min(devicePixelRatio||1,MAX_NORMAL_DPR);renderer.setPixelRatio(dpr);renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',fit);fit();
function setOrbit(next){autoOrbit=!!next;orbitButton.textContent=`自動環繞：${autoOrbit?'開':'關'}`;orbitButton.setAttribute('aria-pressed',String(autoOrbit))}
function notify(text){clearTimeout(toastTimer);toast.textContent=text;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
function clearVista(resetCopy=true){guidedVista='';targetWellRoll=null;vistaButtons.forEach(button=>button.setAttribute('aria-pressed','false'));if(resetCopy&&phase==='explore'){phaseMeta.textContent='拖動畫面檢視引力環與觀測陣列';storyCopy.textContent=FREE_COPY}}
function resetView(){if(phase!=='explore')return;targetYaw=targetPitch=0;guidedVista='';targetWellRoll=NEUTRAL_WELL_ROLL;vistaButtons.forEach(button=>button.setAttribute('aria-pressed','false'));phaseMeta.textContent='拖動畫面檢視引力環與觀測陣列';storyCopy.textContent=FREE_COPY;notify('視角已回正')}
function applyVista(id){const preset=VISTAS[id];if(!preset||phase!=='explore')return false;setOrbit(false);guidedVista=id;targetYaw=preset.yaw;targetPitch=preset.pitch;targetWellRoll=preset.roll;vistaButtons.forEach(button=>button.setAttribute('aria-pressed',button.dataset.nadirVista===id?'true':'false'));phaseMeta.textContent=`構圖導覽 · ${preset.label}`;storyCopy.textContent=preset.copy;notify(`${preset.label} · 已固定構圖`);return true}
function setPhase(next){phase=next;phaseStarted=performance.now();if(next==='arrival'){phaseName.textContent='穿越透鏡弧';phaseMeta.textContent='觀測環正切入穩定視角';storyCopy.textContent='吸積盤被引力壓成兩層弧光，玄淵觀測站沿安全切線掠過。視野會在極短時間內完成最後接近。'}else if(next==='explore'){phaseName.textContent='玄淵自由觀測';phaseMeta.textContent='拖動畫面檢視引力環與觀測陣列';storyCopy.textContent=FREE_COPY;captureButton.disabled=false;vistaRail.hidden=false}}
function smooth(t){return t*t*(3-2*t)}
function update(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(hidden)return;if(phase==='approach'){const t=Math.min(1,(now-phaseStarted)/APPROACH_MS),e=smooth(t);world.position.z=-170+92*e;world.position.x=-10+10*e;well.rotation.y+=dt*.05;if(t>=1)setPhase('arrival')}else if(phase==='arrival'){const t=Math.min(1,(now-phaseStarted)/(TEST_MODE?350:1450)),e=smooth(t);world.position.z=-78+10*e;station.position.x=-21+3*e;if(t>=1)setPhase('explore')}else{if(autoOrbit){targetYaw+=dt*.08;targetPitch=Math.sin(now*.00017)*.045}lookYaw+=(targetYaw-lookYaw)*Math.min(1,dt*5.8);lookPitch+=(targetPitch-lookPitch)*Math.min(1,dt*5.8);world.rotation.y=lookYaw;world.rotation.x=lookPitch;if(targetWellRoll!==null){well.rotation.z+=(targetWellRoll-well.rotation.z)*Math.min(1,dt*6.4);if(Math.abs(targetWellRoll-well.rotation.z)<.001){well.rotation.z=targetWellRoll;targetWellRoll=null}}else if(!guidedVista){well.rotation.z+=dt*.025}diskOuter.rotation.z+=dt*.038;diskInner.rotation.z-=dt*.052;station.rotation.z+=dt*.025}}
function render(now=performance.now()){update(now);renderer.render(scene,camera);requestAnimationFrame(render)}requestAnimationFrame(render);
function point(e){const p=e.touches?.[0]||e;return{x:p.clientX,y:p.clientY}}
function down(e){if(phase!=='explore'||capturing)return;if(guidedVista)clearVista();dragging=true;setOrbit(false);const p=point(e);lastX=p.x;lastY=p.y;canvas.classList.add('dragging')}
function move(e){if(!dragging)return;e.preventDefault();const p=point(e),dx=p.x-lastX,dy=p.y-lastY;lastX=p.x;lastY=p.y;targetYaw+=dx*.0055;targetPitch=Math.max(-.34,Math.min(.34,targetPitch+dy*.0045))}

vistaButtons.forEach(button=>button.addEventListener('click',()=>applyVista(button.dataset.nadirVista)));
orbitButton.addEventListener('click',()=>{if(phase!=='explore')return;const next=!autoOrbit;setOrbit(next);if(next)clearVista()});document.querySelector('#nadirModes').addEventListener('click',()=>{location.href='./index.html?landing=1'});document.querySelector('#nadirAurelia').addEventListener('click',()=>{location.href='./frontier.html'});
async function nextFrame(){await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))}
async function capture(download=true){if(capturing||phase!=='explore')throw new Error('capture unavailable');capturing=true;app.classList.add('capturing');captureButton.disabled=true;const before={pixelRatio:renderer.getPixelRatio(),w:canvas.width,h:canvas.height};try{renderer.setPixelRatio(Math.min(devicePixelRatio||1,MAX_CAPTURE_DPR));renderer.setSize(innerWidth,innerHeight,false);await nextFrame();renderer.render(scene,camera);const data=canvas.toDataURL('image/png'),bytes=Math.floor((data.length-data.indexOf(',')-1)*.75);if(download){const a=document.createElement('a');a.href=data;a.download='stellar-wrap-nadir-well.png';a.click()}notify(`已建立 ${canvas.width} × ${canvas.height} 高畫質留影`);return{width:canvas.width,height:canvas.height,cssWidth:innerWidth,cssHeight:innerHeight,bytes}}finally{renderer.setPixelRatio(before.pixelRatio);renderer.setSize(innerWidth,innerHeight,false);capturing=false;app.classList.remove('capturing');captureButton.disabled=false}}

</script>
