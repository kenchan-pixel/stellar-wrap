<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#010204">
<title>NADIR WELL｜固定黑洞景觀 · Stellar Wrap</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010204}#nadirApp{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 43%,#070910,#010204 64%,#000 100%)}#nadirSpace{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,transparent 34%,rgba(0,0,0,.1) 59%,rgba(0,0,0,.84) 100%)}.film{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.14;background:linear-gradient(116deg,transparent 0 38%,rgba(118,160,255,.055) 48%,transparent 58%),radial-gradient(circle at 68% 18%,rgba(114,151,255,.05),transparent 26%)}#nadirLoading{position:absolute;inset:0;display:grid;place-items:center;background:#010204;color:rgba(225,239,255,.7);font:10px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans HK",sans-serif;letter-spacing:.08em;transition:opacity .25s}.ready #nadirLoading{opacity:0;pointer-events:none}@media(prefers-reduced-motion:reduce){#nadirLoading{transition:none}}
</style>
</head>
<body>
<div id="nadirApp"><canvas id="nadirSpace" aria-label="NADIR WELL 固定黑洞景觀：事件視界、吸積盤、引力透鏡冠與前景干涉觀測陣列"></canvas><div class="vignette"></div><div class="film"></div><div id="nadirLoading">正在建立 NADIR 引力井…</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';

const app=document.querySelector('#nadirApp');
const canvas=document.querySelector('#nadirSpace');
const MAX_NORMAL_DPR=1.25;
const MAX_CAPTURE_DPR=1.60;
const TEST_MODE=new URLSearchParams(location.search).get('test')==='1';
const APPROACH_MS=TEST_MODE?900:5600;
const ARRIVAL_MS=TEST_MODE?260:1050;
const VISUAL_ID='NADIR_FIXED_LENSING_V4';
const QUALITY_ID='NADIR_OBSERVATORY_DEPTH_V3';
const OBSERVATORY_PROFILE='NADIR_INTERFEROMETER_FRAME_V1';
let phase='approach';
let phaseStarted=performance.now();
let capturing=false;
let hidden=document.hidden;
let last=performance.now();
let frameId=0;

const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false,powerPreference:'high-performance',stencil:false,depth:true,preserveDrawingBuffer:false});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.setClearColor(0x010204,1);
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x010204,.0036);
const camera=new THREE.PerspectiveCamera(47,innerWidth/innerHeight,.1,700);
camera.position.set(0,0,62);

function seeded(seed){return()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296)}
const rnd=seeded(90471);
function glowTexture(){
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,1,64,64,63);
  g.addColorStop(0,'rgba(255,244,220,.92)');
  g.addColorStop(.12,'rgba(255,176,82,.56)');
  g.addColorStop(.42,'rgba(255,93,28,.12)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const glow=glowTexture();

function buildStarField(){
  const count=620,p=new Float32Array(count*3),col=new Float32Array(count*3);
  let i=0;
  while(i<count){
    const x=(rnd()-.5)*154,y=(rnd()-.5)*182;
    const centralClearance=Math.abs(x)<22&&Math.abs(y)<14;
    if(centralClearance)continue;
    const z=-32-rnd()*280;
    p[i*3]=x;p[i*3+1]=y;p[i*3+2]=z;
    const c=.46+rnd()*.5,warm=rnd()>.9;
    col[i*3]=c*(warm?1:.72);col[i*3+1]=c*(warm?.82:.84);col[i*3+2]=c*(warm?.67:1);
    i++;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:.44,vertexColors:true,transparent:true,opacity:.68,depthWrite:false,sizeAttenuation:true});
  scene.add(new THREE.Points(g,m));
}
buildStarField();

const hero=new THREE.Group();hero.position.set(0,2,-30);hero.scale.setScalar(.68);scene.add(hero);
const blackHole=new THREE.Group();blackHole.rotation.z=-.035;hero.add(blackHole);

const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,color:0xff7a31,transparent:true,opacity:.1,blending:THREE.AdditiveBlending,depthWrite:false}));
halo.scale.set(35,23,1);halo.position.z=-2.8;blackHole.add(halo);

const diskUniforms={time:{value:0}};
const diskMaterial=new THREE.ShaderMaterial({
  uniforms:diskUniforms,transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
  vertexShader:`varying vec2 vLocal;void main(){vLocal=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`precision highp float;varying vec2 vLocal;uniform float time;void main(){
    float r=length(vLocal);float a=atan(vLocal.y,vLocal.x);
    float edge=smoothstep(6.55,6.9,r)*(1.0-smoothstep(15.0,15.65,r));
    float filament=.54+.24*sin(r*5.4+a*13.0-time*.58)+.13*sin(r*10.1-a*19.0+time*.36);
    filament=clamp(filament,.1,1.0);
    float hot=1.0-smoothstep(6.7,13.8,r);
    float approaching=.5+.5*cos(a-3.14159);
    vec3 warm=mix(vec3(.58,.035,.008),vec3(1.0,.32,.04),hot);
    vec3 cool=vec3(.72,.88,1.0);
    vec3 color=mix(warm,cool,smoothstep(.6,.96,approaching)*(.32+.58*hot));
    float alpha=edge*filament*(.26+.6*hot)*(.48+.52*approaching);
    gl_FragColor=vec4(color,alpha);
  }`
});
const disk=new THREE.Mesh(new THREE.RingGeometry(6.55,15.65,192,1),diskMaterial);
disk.rotation.x=1.29;disk.rotation.z=-.035;disk.position.z=-.55;disk.renderOrder=1;blackHole.add(disk);

const lensingMaterial=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
  vertexShader:`varying vec2 vLocal;void main(){vLocal=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`precision highp float;varying vec2 vLocal;void main(){
    vec2 p=vLocal;
    float r=length(vec2(p.x*.58,p.y));
    float ring=smoothstep(5.72,5.98,r)*(1.0-smoothstep(7.28,7.78,r));
    float vertical=smoothstep(3.65,5.25,abs(p.y));
    float sideFade=1.0-smoothstep(12.2,17.8,abs(p.x));
    float approaching=clamp(.5-p.x*.045,0.0,1.0);
    float crown=ring*vertical*sideFade;
    float photon=smoothstep(5.82,5.94,r)*(1.0-smoothstep(6.18,6.38,r))*vertical*sideFade;
    vec3 warm=vec3(1.0,.24,.025),cool=vec3(.72,.9,1.0);
    vec3 color=mix(warm,cool,approaching);
    float alpha=crown*(.16+.38*approaching)+photon*(.18+.48*approaching);
    gl_FragColor=vec4(color,alpha);
  }`
});
const lensingCrown=new THREE.Mesh(new THREE.PlaneGeometry(44,26),lensingMaterial);
lensingCrown.position.z=-1.2;lensingCrown.renderOrder=2;blackHole.add(lensingCrown);

const causticUniforms={time:{value:0}};
const causticMaterial=new THREE.ShaderMaterial({
  uniforms:causticUniforms,transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`precision highp float;varying vec2 vUv;uniform float time;void main(){
    vec2 p=(vUv-.5)*vec2(50.0,31.0);float ax=abs(p.x);float ay=abs(p.y);
    float curve=6.0+.012*p.x*p.x;
    float d=abs(ay-curve);
    float ribbon=(1.0-smoothstep(.0,.62,d))*smoothstep(3.8,6.0,ay)*(1.0-smoothstep(15.0,23.0,ax));
    float echo=(1.0-smoothstep(.0,.34,abs(d-1.15)))*smoothstep(4.8,6.4,ay)*(1.0-smoothstep(13.0,22.0,ax));
    float shimmer=.72+.28*sin(ax*1.75+time*.7+(p.y>0.0?0.0:1.7));
    float blue=clamp(.52-p.x*.035,0.0,1.0);
    vec3 color=mix(vec3(1.0,.16,.02),vec3(.55,.78,1.0),blue);
    float alpha=(ribbon*.19+echo*.11)*shimmer;
    gl_FragColor=vec4(color,alpha);
  }`
});
const causticSheet=new THREE.Mesh(new THREE.PlaneGeometry(50,31),causticMaterial);
causticSheet.position.z=-1.5;causticSheet.rotation.z=-.035;causticSheet.renderOrder=2;blackHole.add(causticSheet);

const shadow=new THREE.Mesh(new THREE.SphereGeometry(5.82,48,32),new THREE.MeshBasicMaterial({color:0x000000}));
shadow.renderOrder=4;blackHole.add(shadow);

function buildDeflectedStars(){
  const count=92,p=new Float32Array(count*3),col=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const upper=i<count/2;const t=(i%(count/2))/(count/2-1);const x=-16+t*32+(rnd()-.5)*.55;
    const bend=6.1+.018*x*x+(rnd()-.5)*.42;
    p[i*3]=x;p[i*3+1]=(upper?1:-1)*bend;p[i*3+2]=-1.7-rnd()*1.4;
    const c=.56+rnd()*.32;col[i*3]=c*.8;col[i*3+1]=c*.88;col[i*3+2]=c;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:.2,vertexColors:true,transparent:true,opacity:.26,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
  const points=new THREE.Points(g,m);points.rotation.z=-.035;blackHole.add(points);
}
buildDeflectedStars();

function buildLensedStreaks(){
  const segments=36,p=new Float32Array(segments*2*3),c=new Float32Array(segments*2*3);
  for(let i=0;i<segments;i++){
    const upper=i%2===0,side=i%3===0?-1:1,t=(i+.5)/segments;
    const x=side*(7.4+rnd()*10.4),base=6.3+.018*x*x+(rnd()-.5)*.34,y=(upper?1:-1)*base;
    const len=.28+.72*(1-Math.min(1,Math.abs(x)/20));
    p[i*6]=x-len;p[i*6+1]=y;p[i*6+2]=-2.0;
    p[i*6+3]=x+len;p[i*6+4]=y+(upper?.08:-.08);p[i*6+5]=-2.0;
    const cool=x<0,rr=cool?.68:1,gg=cool?.82:.42,bb=cool?1:.16;
    for(let j=0;j<2;j++){c[i*6+j*3]=rr;c[i*6+j*3+1]=gg;c[i*6+j*3+2]=bb}
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(c,3));
  const m=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false});
  const streaks=new THREE.LineSegments(g,m);streaks.rotation.z=-.035;blackHole.add(streaks);
}
buildLensedStreaks();

const photonP=new Float32Array(28*3),photonC=new Float32Array(28*3);
for(let i=0;i<28;i++){
  const upper=i<14,t=upper?i/13:(i-14)/13,arc=(.08+.84*t)*Math.PI,r=6.08+(rnd()-.5)*.12;
  const angle=upper?arc:-arc;
  photonP[i*3]=Math.cos(angle)*r*1.58;photonP[i*3+1]=Math.sin(angle)*r*.72;photonP[i*3+2]=-1.02;
  const blue=photonP[i*3]<0;photonC[i*3]=blue?.7:1;photonC[i*3+1]=blue?.86:.55;photonC[i*3+2]=blue?1:.22;
}
const photonG=new THREE.BufferGeometry();photonG.setAttribute('position',new THREE.BufferAttribute(photonP,3));photonG.setAttribute('color',new THREE.BufferAttribute(photonC,3));
const photonM=new THREE.PointsMaterial({size:.34,vertexColors:true,transparent:true,opacity:.58,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
const photonBank=new THREE.Points(photonG,photonM);photonBank.rotation.z=-.035;blackHole.add(photonBank);

const observatory=new THREE.Group();observatory.position.set(0,0,4.6);hero.add(observatory);
const dummy=new THREE.Object3D();
const collectorLayout=[
  {p:[-10.3,-12.4,2.6],r:[.34,.56,-.2],s:1.0},
  {p:[10.2,-14.4,-6.8],r:[.25,-.5,.17],s:.74},
  {p:[11.6,8.4,-15.5],r:[-.18,-.62,.08],s:.48}
];
const collectorGeo=new THREE.TorusGeometry(2.7,.28,6,48),collectorMat=new THREE.MeshStandardMaterial({color:0x435c6f,metalness:.9,roughness:.3,emissive:0x061821,emissiveIntensity:.48}),collectors=new THREE.InstancedMesh(collectorGeo,collectorMat,collectorLayout.length);
const collectorGlowGeo=new THREE.TorusGeometry(2.7,.052,4,40),collectorGlowMat=new THREE.MeshBasicMaterial({color:0x7bdcff,transparent:true,opacity:.52,blending:THREE.AdditiveBlending,depthWrite:false}),collectorGlows=new THREE.InstancedMesh(collectorGlowGeo,collectorGlowMat,collectorLayout.length);
collectorLayout.forEach((entry,i)=>{dummy.position.set(...entry.p);dummy.rotation.set(...entry.r);dummy.scale.setScalar(entry.s);dummy.updateMatrix();collectors.setMatrixAt(i,dummy.matrix);collectorGlows.setMatrixAt(i,dummy.matrix)});observatory.add(collectors,collectorGlows);

const trussGeo=new THREE.BoxGeometry(.18,.18,4.2),trussMat=new THREE.MeshStandardMaterial({color:0x526a7d,metalness:.86,roughness:.34,emissive:0x05141c,emissiveIntensity:.36}),trusses=new THREE.InstancedMesh(trussGeo,trussMat,12);
const trussLayout=[
 [-12.6,-14.5,1.0,.18,.72,-.16,1.18],[-10.9,-15.6,.4,.22,.66,-.07,1.0],[-8.8,-14.4,-.5,.1,.78,.06,.92],[-11.4,-11.0,1.2,.72,.18,.28,.7],
 [12.5,-16.2,-8.0,.16,-.68,.12,.9],[10.4,-16.7,-8.5,.22,-.61,.02,.78],[8.6,-15.0,-9.3,.1,-.76,-.08,.72],[11.6,-12.5,-7.5,.66,-.2,-.2,.56],
 [13.5,9.7,-17.0,-.14,-.62,.06,.56],[11.7,10.4,-17.8,-.2,-.56,-.04,.49],[10.2,8.8,-18.4,-.08,-.72,-.12,.45],[12.8,6.7,-16.8,-.58,-.14,.18,.38]
];
trussLayout.forEach((v,i)=>{dummy.position.set(v[0],v[1],v[2]);dummy.rotation.set(v[3],v[4],v[5]);dummy.scale.set(1,1,v[6]);dummy.updateMatrix();trusses.setMatrixAt(i,dummy.matrix)});observatory.add(trusses);

const podGeo=new THREE.BoxGeometry(.4,.66,1.02),podMat=new THREE.MeshStandardMaterial({color:0x617b8e,metalness:.8,roughness:.34,emissive:0x062c3a,emissiveIntensity:.5}),pods=new THREE.InstancedMesh(podGeo,podMat,12);
const podLayout=[[-10.3,-9.4,2.6],[-10.2,-15.2,2.4],[-7.6,-12.5,1.7],[-12.8,-12.2,3.1],[10.2,-12.2,-6.8],[10.2,-16.5,-7],[8.2,-14.4,-7.8],[12.2,-14.3,-6.1],[11.6,9.8,-15.5],[11.6,7,-15.6],[10.2,8.4,-16.4],[12.9,8.4,-14.7]];
podLayout.forEach((p,i)=>{const scale=i<4?1:i<8?.76:.52;dummy.position.set(...p);dummy.rotation.set(.1*(i%2?-1:1),.22*(i%3-1),i*.18);dummy.scale.setScalar(scale);dummy.updateMatrix();pods.setMatrixAt(i,dummy.matrix)});observatory.add(pods);

const beaconGeo=new THREE.BoxGeometry(.12,.12,2.2),beaconMat=new THREE.MeshBasicMaterial({color:0x74d7ff,transparent:true,opacity:.34}),beacons=new THREE.InstancedMesh(beaconGeo,beaconMat,10);
for(let i=0;i<10;i++){const side=i%2===0?-1:1,row=Math.floor(i/2);dummy.position.set(side*(11.8+row*1.7),-17+row*5.2,-9-row*13);dummy.rotation.set(.14*side,.06,side*.12);dummy.scale.set(1,1,1+.23*row);dummy.updateMatrix();beacons.setMatrixAt(i,dummy.matrix)}
hero.add(beacons);
scene.add(new THREE.AmbientLight(0x22354a,.3));const stationRim=new THREE.DirectionalLight(0xbde8ff,1.0);stationRim.position.set(-4,3,6);scene.add(stationRim);

function fit(pixelRatio=Math.min(devicePixelRatio||1,MAX_NORMAL_DPR)){
  renderer.setPixelRatio(pixelRatio);renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
}
addEventListener('resize',()=>fit());fit();

function smooth(t){return t*t*(3-2*t)}
function settleFinal(){hero.position.set(0,2,0);hero.scale.setScalar(1);phase='explore';phaseStarted=performance.now()}
function update(now){
  last=now;if(hidden)return;
  diskUniforms.time.value=now*.001;
  causticUniforms.time.value=now*.001;
  photonM.opacity=.52+.08*Math.sin(now*.0011);
  if(phase==='approach'){
    const t=Math.min(1,(now-phaseStarted)/APPROACH_MS),e=smooth(t);hero.position.z=-30+24*e;hero.scale.setScalar(.68+.24*e);if(t>=1){phase='arrival';phaseStarted=now}
  }else if(phase==='arrival'){
    const t=Math.min(1,(now-phaseStarted)/ARRIVAL_MS),e=smooth(t);hero.position.z=-6+6*e;hero.scale.setScalar(.92+.08*e);if(t>=1)settleFinal();
  }
}
function render(now=performance.now()){update(now);renderer.render(scene,camera);frameId=requestAnimationFrame(render)}
frameId=requestAnimationFrame(render);
requestAnimationFrame(()=>app.classList.add('ready'));

document.addEventListener('visibilitychange',()=>{hidden=document.hidden;last=performance.now()});
function nextFrame(){return new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))}
async function capture(download=true){
  if(phase!=='explore'||capturing)throw new Error('capture unavailable');capturing=true;
  const previous=renderer.getPixelRatio();
  try{
    fit(Math.max(previous,Math.min(devicePixelRatio||1,MAX_CAPTURE_DPR)));
    await nextFrame();renderer.render(scene,camera);
    const width=canvas.width,height=canvas.height;
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error('PNG export failed')),'image/png'));
    if(download){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`stellar-wrap-nadir-fixed-${Date.now()}.png`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),0)}
    return{width,height,blobSize:blob.size};
  }finally{fit(previous);capturing=false}
}
function state(){
  return{phase,autoOrbit:false,vista:'overview',capturing,visualId:VISUAL_ID,qualityId:QUALITY_ID,observatoryProfile:OBSERVATORY_PROFILE,fixed:true,jets:false,eventHorizon:true,lensingCrown:true,photonCrown:true,causticSheet:true,starDeflection:true,lensedStreaks:true,observatoryFrame:true,collectorRings:3,trussBeams:12,receiverPods:12,depthBeacons:10,dopplerAsymmetry:true,portalRing:false,backingWidth:canvas.width,backingHeight:canvas.height,pixelRatio:renderer.getPixelRatio(),drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles};
}
function applyVista(id){return id==='overview'}
function skipArrival(){settleFinal();return true}
window.WarpFrontierNadir={state,applyVista,skipArrival,capture};
addEventListener('pagehide',()=>{cancelAnimationFrame(frameId);scene.traverse(object=>{object.geometry?.dispose?.();const material=object.material;if(Array.isArray(material))material.forEach(item=>item?.dispose?.());else material?.dispose?.()});glow.dispose();renderer.dispose()},{once:true});
</script>
</body>
</html>
