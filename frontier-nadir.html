<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#010204">
<title>NADIR WELL｜固定黑洞景觀 · Stellar Wrap</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010204}#nadirApp{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 43%,#05070d,#010204 66%,#000 100%)}#nadirSpace{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 39%,rgba(0,0,0,.16) 67%,rgba(0,0,0,.82) 100%)}#nadirLoading{position:absolute;inset:0;display:grid;place-items:center;background:#010204;color:rgba(225,239,255,.7);font:10px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans HK",sans-serif;letter-spacing:.08em;transition:opacity .25s}.ready #nadirLoading{opacity:0;pointer-events:none}@media(prefers-reduced-motion:reduce){#nadirLoading{transition:none}}
</style>
</head>
<body>
<div id="nadirApp"><canvas id="nadirSpace" aria-label="NADIR WELL 固定黑洞景觀：事件視界、吸積盤與上下引力透鏡冠"></canvas><div class="vignette"></div><div id="nadirLoading">正在建立 NADIR 引力井…</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';

const app=document.querySelector('#nadirApp');
const canvas=document.querySelector('#nadirSpace');
const MAX_NORMAL_DPR=1.25;
const MAX_CAPTURE_DPR=1.60;
const TEST_MODE=new URLSearchParams(location.search).get('test')==='1';
const APPROACH_MS=TEST_MODE?900:5600;
const ARRIVAL_MS=TEST_MODE?260:1050;
const VISUAL_ID='NADIR_FIXED_LENSING_V4';
let phase='approach';
let phaseStarted=performance.now();
let capturing=false;
let hidden=document.hidden;
let last=performance.now();
let frameId=0;

const renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:false,powerPreference:'high-performance',stencil:false,depth:true,preserveDrawingBuffer:false});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.setClearColor(0x010204,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(47,innerWidth/innerHeight,.1,700);
camera.position.set(0,0,62);

function seeded(seed){return()=>((seed=Math.imul(seed,1664525)+1013904223>>>0)/4294967296)}
const rnd=seeded(90471);
function glowTexture(){
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,1,64,64,63);
  g.addColorStop(0,'rgba(255,244,220,.92)');
  g.addColorStop(.12,'rgba(255,176,82,.56)');
  g.addColorStop(.42,'rgba(255,93,28,.12)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const glow=glowTexture();

function buildStarField(){
  const count=620,p=new Float32Array(count*3),col=new Float32Array(count*3);
  let i=0;
  while(i<count){
    const x=(rnd()-.5)*154,y=(rnd()-.5)*182;
    const centralClearance=Math.abs(x)<22&&Math.abs(y)<14;
    if(centralClearance)continue;
    const z=-32-rnd()*280;
    p[i*3]=x;p[i*3+1]=y;p[i*3+2]=z;
    const c=.46+rnd()*.5,warm=rnd()>.9;
    col[i*3]=c*(warm?1:.72);col[i*3+1]=c*(warm?.82:.84);col[i*3+2]=c*(warm?.67:1);
    i++;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:.44,vertexColors:true,transparent:true,opacity:.68,depthWrite:false,sizeAttenuation:true});
  scene.add(new THREE.Points(g,m));
}
buildStarField();

const hero=new THREE.Group();hero.position.set(0,2,-30);hero.scale.setScalar(.68);scene.add(hero);
const blackHole=new THREE.Group();blackHole.rotation.z=-.035;hero.add(blackHole);

const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,color:0xff7a31,transparent:true,opacity:.1,blending:THREE.AdditiveBlending,depthWrite:false}));
halo.scale.set(35,23,1);halo.position.z=-2.8;blackHole.add(halo);

const diskUniforms={time:{value:0}};
const diskMaterial=new THREE.ShaderMaterial({
  uniforms:diskUniforms,transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
  vertexShader:`varying vec2 vLocal;void main(){vLocal=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`precision highp float;varying vec2 vLocal;uniform float time;void main(){
    float r=length(vLocal);float a=atan(vLocal.y,vLocal.x);
    float edge=smoothstep(6.55,6.9,r)*(1.0-smoothstep(15.0,15.65,r));
    float filament=.54+.24*sin(r*5.4+a*13.0-time*.58)+.13*sin(r*10.1-a*19.0+time*.36);
    filament=clamp(filament,.1,1.0);
    float hot=1.0-smoothstep(6.7,13.8,r);
    float approaching=.5+.5*cos(a-3.14159);
    vec3 warm=mix(vec3(.58,.035,.008),vec3(1.0,.32,.04),hot);
    vec3 cool=vec3(.72,.88,1.0);
    vec3 color=mix(warm,cool,smoothstep(.6,.96,approaching)*(.32+.58*hot));
    float alpha=edge*filament*(.26+.6*hot)*(.48+.52*approaching);
    gl_FragColor=vec4(color,alpha);
  }`
});
const disk=new THREE.Mesh(new THREE.RingGeometry(6.55,15.65,192,1),diskMaterial);
disk.rotation.x=1.29;disk.rotation.z=-.035;disk.position.z=-.55;disk.renderOrder=1;blackHole.add(disk);

const lensingMaterial=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,
  vertexShader:`varying vec2 vLocal;void main(){vLocal=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`precision highp float;varying vec2 vLocal;void main(){
    vec2 p=vLocal;
    float r=length(vec2(p.x*.58,p.y));
    float ring=smoothstep(5.72,5.98,r)*(1.0-smoothstep(7.28,7.78,r));
    float vertical=smoothstep(3.65,5.25,abs(p.y));
    float sideFade=1.0-smoothstep(12.2,17.8,abs(p.x));
    float approaching=clamp(.5-p.x*.045,0.0,1.0);
    float crown=ring*vertical*sideFade;
    float photon=smoothstep(5.82,5.94,r)*(1.0-smoothstep(6.18,6.38,r))*vertical*sideFade;
    vec3 warm=vec3(1.0,.24,.025),cool=vec3(.72,.9,1.0);
    vec3 color=mix(warm,cool,approaching);
    float alpha=crown*(.16+.38*approaching)+photon*(.18+.48*approaching);
    gl_FragColor=vec4(color,alpha);
  }`
});
const lensingCrown=new THREE.Mesh(new THREE.PlaneGeometry(44,26),lensingMaterial);
lensingCrown.position.z=-1.2;lensingCrown.renderOrder=2;blackHole.add(lensingCrown);

const shadow=new THREE.Mesh(new THREE.SphereGeometry(5.82,48,32),new THREE.MeshBasicMaterial({color:0x000000}));
shadow.renderOrder=4;blackHole.add(shadow);

function buildDeflectedStars(){
  const count=92,p=new Float32Array(count*3),col=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const upper=i<count/2;const t=(i%(count/2))/(count/2-1);const x=-16+t*32+(rnd()-.5)*.55;
    const bend=6.1+.018*x*x+(rnd()-.5)*.42;
    p[i*3]=x;p[i*3+1]=(upper?1:-1)*bend;p[i*3+2]=-1.7-rnd()*1.4;
    const c=.56+rnd()*.32;col[i*3]=c*.8;col[i*3+1]=c*.88;col[i*3+2]=c;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:.2,vertexColors:true,transparent:true,opacity:.26,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
  const points=new THREE.Points(g,m);points.rotation.z=-.035;blackHole.add(points);
}
buildDeflectedStars();

const station=new THREE.Group();station.position.set(-11.9,-12.7,3.8);station.rotation.set(.34,.58,-.22);hero.add(station);
const stationRing=new THREE.Mesh(new THREE.TorusGeometry(3.05,.3,6,56),new THREE.MeshStandardMaterial({color:0x3f5262,metalness:.88,roughness:.34,emissive:0x061a22,emissiveIntensity:.52}));station.add(stationRing);
const stationGlow=new THREE.Mesh(new THREE.TorusGeometry(3.05,.048,4,56),new THREE.MeshBasicMaterial({color:0x70d7ff,transparent:true,opacity:.52,blending:THREE.AdditiveBlending,depthWrite:false}));station.add(stationGlow);
const spine=new THREE.Mesh(new THREE.BoxGeometry(.3,1.0,5.8),new THREE.MeshStandardMaterial({color:0x526575,metalness:.84,roughness:.35,emissive:0x06151c,emissiveIntensity:.42}));spine.rotation.x=Math.PI/2;station.add(spine);
const podGeo=new THREE.BoxGeometry(.38,.62,.96),podMat=new THREE.MeshStandardMaterial({color:0x5b7182,metalness:.78,roughness:.36,emissive:0x062b3a,emissiveIntensity:.46}),pods=new THREE.InstancedMesh(podGeo,podMat,8),dummy=new THREE.Object3D();
for(let i=0;i<8;i++){const a=i/8*Math.PI*2;dummy.position.set(Math.cos(a)*3.05,Math.sin(a)*3.05,0);dummy.rotation.set(0,0,a);dummy.updateMatrix();pods.setMatrixAt(i,dummy.matrix)}station.add(pods);
scene.add(new THREE.AmbientLight(0x22354a,.3));const stationRim=new THREE.DirectionalLight(0xbde8ff,1.0);stationRim.position.set(-4,3,6);scene.add(stationRim);

function fit(pixelRatio=Math.min(devicePixelRatio||1,MAX_NORMAL_DPR)){
  renderer.setPixelRatio(pixelRatio);renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
}
addEventListener('resize',()=>fit());fit();

function smooth(t){return t*t*(3-2*t)}
function settleFinal(){hero.position.set(0,2,0);hero.scale.setScalar(1);phase='explore';phaseStarted=performance.now()}
function update(now){
  last=now;if(hidden)return;
  diskUniforms.time.value=now*.001;
  if(phase==='approach'){
    const t=Math.min(1,(now-phaseStarted)/APPROACH_MS),e=smooth(t);hero.position.z=-30+24*e;hero.scale.setScalar(.68+.24*e);if(t>=1){phase='arrival';phaseStarted=now}
  }else if(phase==='arrival'){
    const t=Math.min(1,(now-phaseStarted)/ARRIVAL_MS),e=smooth(t);hero.position.z=-6+6*e;hero.scale.setScalar(.92+.08*e);if(t>=1)settleFinal();
  }
}
function render(now=performance.now()){update(now);renderer.render(scene,camera);frameId=requestAnimationFrame(render)}
frameId=requestAnimationFrame(render);
requestAnimationFrame(()=>app.classList.add('ready'));

document.addEventListener('visibilitychange',()=>{hidden=document.hidden;last=performance.now()});
function nextFrame(){return new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))}
async function capture(download=true){
  if(phase!=='explore'||capturing)throw new Error('capture unavailable');capturing=true;
  const previous=renderer.getPixelRatio();
  try{
    fit(Math.max(previous,Math.min(devicePixelRatio||1,MAX_CAPTURE_DPR)));
    await nextFrame();renderer.render(scene,camera);
    const width=canvas.width,height=canvas.height;
    const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error('PNG export failed')),'image/png'));
    if(download){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`stellar-wrap-nadir-fixed-${Date.now()}.png`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),0)}
    return{width,height,blobSize:blob.size};
  }finally{fit(previous);capturing=false}
}
function state(){
  return{phase,autoOrbit:false,vista:'overview',capturing,visualId:VISUAL_ID,fixed:true,jets:false,eventHorizon:true,lensingCrown:true,photonCrown:true,dopplerAsymmetry:true,starDeflection:true,portalRing:false,backingWidth:canvas.width,backingHeight:canvas.height,pixelRatio:renderer.getPixelRatio(),drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles};
}
function applyVista(id){return id==='overview'}
function skipArrival(){settleFinal();return true}
window.WarpFrontierNadir={state,applyVista,skipArrival,capture};
addEventListener('pagehide',()=>{cancelAnimationFrame(frameId);scene.traverse(object=>{object.geometry?.dispose?.();const material=object.material;if(Array.isArray(material))material.forEach(item=>item?.dispose?.());else material?.dispose?.()});glow.dispose();renderer.dispose()},{once:true});
</script>
</body>
</html>
