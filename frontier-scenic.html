<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#03050a">
<title>Frontier Scenic Route · Stellar Wrap</title>
<style>
:root{color-scheme:dark;--safeT:max(12px,env(safe-area-inset-top));--safeB:max(12px,env(safe-area-inset-bottom));--safeL:max(12px,env(safe-area-inset-left));--safeR:max(12px,env(safe-area-inset-right));--line:rgba(190,215,255,.18);--muted:rgba(225,235,248,.64)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050a;color:#f7fbff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans HK",sans-serif}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid #bcdcff;outline-offset:2px}#scenicApp{position:fixed;inset:0;overflow:hidden;background:#03050a}#frontierFrame{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:#03050a}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,2,8,.58),transparent 20%,transparent 66%,rgba(0,2,8,.6));z-index:2}.head{position:absolute;z-index:4;top:var(--safeT);left:var(--safeL);right:var(--safeR);display:flex;justify-content:space-between;gap:10px;pointer-events:none;text-shadow:0 3px 18px #000}.kicker{font-size:8px;letter-spacing:.18em;font-weight:850;color:rgba(180,214,255,.72)}.name{margin-top:4px;font-size:18px;font-weight:820;line-height:1.08}.sub{margin-top:4px;font-size:8px;line-height:1.4;color:var(--muted)}.phase{min-width:92px;padding:8px 9px;border:1px solid var(--line);border-radius:12px;background:rgba(3,7,15,.48);backdrop-filter:blur(10px);text-align:right}.phase b{display:block;font-size:10px}.phase span{display:block;margin-top:3px;font-size:7px;color:var(--muted)}.story{position:absolute;z-index:4;left:var(--safeL);bottom:calc(var(--safeB) + 66px);width:min(84vw,350px);padding:10px 11px;border:1px solid var(--line);border-radius:15px;background:rgba(3,7,15,.5);backdrop-filter:blur(14px);box-shadow:0 14px 40px rgba(0,0,0,.34);pointer-events:none}.story strong{font-size:11px}.story p{margin:5px 0 0;font-size:8px;line-height:1.5;color:var(--muted)}.controls{position:absolute;z-index:6;left:var(--safeL);right:var(--safeR);bottom:var(--safeB);display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px;border:1px solid var(--line);border-radius:16px;background:rgba(3,7,15,.64);backdrop-filter:blur(16px);box-shadow:0 14px 42px rgba(0,0,0,.36)}.controls button{min-height:46px;border:1px solid rgba(190,215,255,.17);border-radius:11px;background:rgba(255,255,255,.055);font-size:8px;font-weight:760}.controls .primary{background:linear-gradient(180deg,rgba(90,164,255,.2),rgba(97,105,220,.1));border-color:rgba(159,207,255,.34)}.controls button:disabled{opacity:.42}.route{position:absolute;z-index:7;left:var(--safeL);right:var(--safeR);bottom:calc(var(--safeB) + 64px);padding:11px;border:1px solid rgba(190,215,255,.18);border-radius:16px;background:rgba(3,7,15,.92);backdrop-filter:blur(18px);box-shadow:0 18px 48px rgba(0,0,0,.46);transform:translateY(18px);opacity:0;visibility:hidden;pointer-events:none;transition:.18s}.route.open{transform:none;opacity:1;visibility:visible;pointer-events:auto}.routeHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.routeHead strong{font-size:11px}.routeHead span{font-size:7px;color:var(--muted)}.routeClose{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.05)}.destGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.destGrid button{min-height:58px;padding:8px 9px;border:1px solid rgba(190,215,255,.16);border-radius:12px;background:rgba(255,255,255,.04);text-align:left}.destGrid button[aria-current="true"]{border-color:rgba(165,211,255,.62);background:rgba(94,154,240,.13)}.destGrid b{display:block;font-size:9px}.destGrid span{display:block;margin-top:3px;font-size:7px;line-height:1.35;color:var(--muted)}#toast{position:absolute;z-index:8;left:50%;bottom:calc(var(--safeB) + 70px);transform:translateX(-50%) translateY(8px);padding:8px 11px;max-width:82vw;border-radius:999px;border:1px solid var(--line);background:rgba(3,7,15,.9);font-size:8px;opacity:0;pointer-events:none;transition:.18s;white-space:nowrap}#toast.show{opacity:1;transform:translateX(-50%)}#loading{position:absolute;z-index:10;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#03050a;font-size:11px;line-height:1.6;transition:opacity .25s}.ready #loading{opacity:0;pointer-events:none}@media(max-width:390px){.controls{grid-template-columns:1fr 1fr}.story{bottom:calc(var(--safeB) + 114px);width:min(88vw,350px)}.route{bottom:calc(var(--safeB) + 114px)}.name{font-size:16px}}@media(prefers-reduced-motion:reduce){.route,#loading,#toast{transition:none}}
</style>
</head>
<body>
<div id="scenicApp"><iframe id="frontierFrame" title="Frontier Fiction 固定景觀"></iframe><div class="shade"></div><header class="head"><div><div class="kicker">FRONTIER FICTION · SCENIC ROUTE</div><div id="name" class="name"></div><div id="sub" class="sub"></div></div><div class="phase"><b id="phaseName">深空接近</b><span id="phaseMeta">固定觀景構圖</span></div></header><section class="story"><strong>固定景觀</strong><p id="story"></p></section><nav class="controls" aria-label="Frontier Fiction 統一操作"><button id="modes" type="button">模式選擇</button><button id="routeButton" type="button" aria-expanded="false">科幻航線</button><button id="real" type="button">Real Space</button><button id="capture" class="primary" type="button" disabled>高畫質留影</button></nav><section id="route" class="route" aria-hidden="true"><div class="routeHead"><div><strong>FRONTIER ROUTE｜科幻目的地</strong><span>同一入口 · 同一觀景介面 · 單角度景觀</span></div><button id="routeClose" class="routeClose" type="button" aria-label="關閉科幻航線">×</button></div><div id="destGrid" class="destGrid"></div></section><div id="toast" role="status" aria-live="polite"></div><div id="loading">正在建立固定 Frontier 景觀…<br><small>沿用現有 3D 場景 · 鎖定策展構圖 · 無自由旋轉</small></div></div>
<script>
(() => {
'use strict';
const DESTS={
 AURELIA:{name:'AURELIA ARC｜曙光環域',sub:'人工巨構棲息環 · 固定環域全景',story:'以策展好的單一角度呈現完整棲息環、中央核心與遠方伴星；不再要求玩家旋轉模型尋找正確構圖。',path:'frontier.html',api:'WarpFrontier',vista:'overview'},
 NADIR:{name:'NADIR WELL｜玄淵觀測站',sub:'黑洞前線 · 固定引力井全景',story:'以事件視界、吸積盤、透鏡環與觀測站的固定英雄構圖呈現黑洞前線，避免自由旋轉破壞主視覺。',path:'frontier-nadir.html',api:'WarpFrontierNadir',vista:'overview'},
 VESPER:{name:'VESPER YARD｜暮環採集場',sub:'氣巨星採集帶 · 固定雲頂主環',story:'以雲頂、工業環與貨運層的固定景觀建立清楚的工業尺度，保留既有場景及高畫質留影。',path:'frontier-vesper.html',api:'WarpFrontierVesper',vista:'overview'},
 EIDOLON:{name:'EIDOLON GATE｜遺光門廊',sub:'古文明門廊 · 固定斷環全景',story:'以破碎雙環、殘存光紋與前景遺跡的固定構圖呈現古文明尺度，不再以可旋轉展品方式探索。',path:'frontier-eidolon.html',api:'WarpFrontierEidolon',vista:'overview'}
};
const app=document.querySelector('#scenicApp'),frame=document.querySelector('#frontierFrame'),nameEl=document.querySelector('#name'),subEl=document.querySelector('#sub'),storyEl=document.querySelector('#story'),phaseName=document.querySelector('#phaseName'),phaseMeta=document.querySelector('#phaseMeta'),captureButton=document.querySelector('#capture'),route=document.querySelector('#route'),routeButton=document.querySelector('#routeButton'),grid=document.querySelector('#destGrid'),toast=document.querySelector('#toast');
let dest='',api=null,timer=0,toastTimer=0,locked=false;
function validDest(value){value=String(value||'').toUpperCase();return DESTS[value]?value:'AURELIA'}
function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
function setRoute(open){route.classList.toggle('open',open);route.setAttribute('aria-hidden',String(!open));routeButton.setAttribute('aria-expanded',String(open));if(open)grid.querySelector('[aria-current="true"]')?.focus?.()}
function renderGrid(){grid.replaceChildren();for(const [id,d] of Object.entries(DESTS)){const b=document.createElement('button');b.type='button';b.dataset.dest=id;b.setAttribute('aria-current',String(id===dest));b.innerHTML=`<b>${d.name}</b><span>${d.sub}</span>`;b.addEventListener('click',()=>{if(id===dest){setRoute(false);return}select(id)});grid.append(b)}}
function childApi(){try{return frame.contentWindow?.[DESTS[dest].api]||null}catch{return null}}
function hideChildUi(){try{const doc=frame.contentDocument;if(!doc||doc.querySelector('#scenicLockStyle'))return;const style=doc.createElement('style');style.id='scenicLockStyle';style.textContent='.ui,.frontierUi,#frontierToast,#nadirToast,#vesperToast,#eidolonToast{display:none!important} canvas{cursor:default!important}';doc.head.append(style)}catch{}}
function sync(){api=childApi();if(!api)return;hideChildUi();const state=api.state?.();if(!state)return;const phase=state.phase||'approach';phaseName.textContent=phase==='explore'?'景觀停泊':phase==='arrival'?'抵達構圖':'深空接近';phaseMeta.textContent=phase==='explore'?'單角度固定景觀':phase==='arrival'?'進入英雄構圖':'保持既有接近段';captureButton.disabled=phase!=='explore'||!!state.capturing;if(phase==='explore'&&!locked){api.applyVista?.(DESTS[dest].vista);locked=true}if(phase==='explore'&&state.autoOrbit){const orbit=frame.contentDocument?.querySelector?.('[id$="Orbit"]');orbit?.click?.()}app.classList.add('ready')}
function select(id){dest=validDest(id);locked=false;api=null;const d=DESTS[dest];nameEl.textContent=d.name;subEl.textContent=d.sub;storyEl.textContent=d.story;renderGrid();setRoute(false);captureButton.disabled=true;app.classList.remove('ready');const url=new URL(location.href);url.searchParams.set('dest',dest);history.replaceState(null,'',url);frame.src=`./${d.path}?scenic=1`;clearInterval(timer);timer=setInterval(sync,200)}
async function capture(download=true){const child=childApi();if(!child||child.state?.().phase!=='explore')throw new Error('capture unavailable');captureButton.disabled=true;try{const result=await child.capture(download);notify(`已建立 ${result.width} × ${result.height} 留影`);return result}finally{sync()}}
frame.addEventListener('load',()=>{hideChildUi();sync()});routeButton.addEventListener('click',()=>setRoute(!route.classList.contains('open')));document.querySelector('#routeClose').addEventListener('click',()=>setRoute(false));document.querySelector('#modes').addEventListener('click',()=>location.href='./index.html?landing=1');document.querySelector('#real').addEventListener('click',()=>location.href='./index.html?mode=real');captureButton.addEventListener('click',()=>capture(true).catch(()=>notify('留影失敗，請再試一次')));
select(new URLSearchParams(location.search).get('dest'));
window.WarpFrontierScenic={state(){const child=childApi();return{destination:dest,fixed:true,routeOpen:route.classList.contains('open'),child:child?.state?.()||null,framePointerEvents:getComputedStyle(frame).pointerEvents,controls:document.querySelectorAll('.controls button').length,destinations:grid.querySelectorAll('button').length}},skipArrival(){const child=childApi();child?.skipArrival?.();sync();return true},openRoute(){setRoute(true);return true},select(id){select(id);return true},capture(download=false){return capture(download)}};
})();
</script>
</body>
</html>
