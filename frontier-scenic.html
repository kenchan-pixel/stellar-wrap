<body>
<div id="scenicApp"><iframe id="frontierFrame" title="Frontier Fiction 固定景觀"></iframe><div class="shade"></div><header class="head"><div><div class="kicker">FRONTIER FICTION · SCENIC DESTINATION</div><div id="name" class="name"></div><div id="sub" class="sub"></div></div><div class="phase"><b id="phaseName">深空接近</b><span id="phaseMeta">固定觀景構圖</span></div></header><section class="story"><strong>固定景觀</strong><p id="story"></p></section><nav class="controls" aria-label="Frontier Fiction 統一操作"><button id="modes" type="button">模式選擇</button><button id="routeButton" type="button" aria-expanded="false" data-legacy-label="科幻航線">科幻目的地</button><button id="real" type="button">Real Space</button><button id="capture" class="primary" type="button" disabled>高畫質留影</button></nav><section id="route" class="route" aria-hidden="true"><div class="routeHead"><div><strong>FRONTIER DESTINATIONS｜科幻目的地</strong><span>四站同級 · 先選擇再確認 · 不虛構距離／航段</span></div><button id="routeClose" class="routeClose" type="button" aria-label="關閉科幻目的地">×</button></div><div id="destGrid" class="destGrid"></div><section id="destinationCommit" class="destinationCommit" aria-hidden="true"><small>DESTINATION CONFIRM｜目的地確認</small><b id="destinationCommitName"></b><p id="destinationCommitDetail"></p><div class="destinationCommitActions"><button id="destinationCommitCancel" type="button">取消</button><button id="destinationCommitConfirm" class="primary" type="button">前往景觀</button></div></section></section><div id="transition" class="transition" aria-hidden="true"><div class="transitionStack"><div class="transitionSig" aria-hidden="true"><span class="sigOrb"></span><span class="sigArcA"></span><span class="sigArcB"></span><span class="sigMarks"></span></div><div class="transitionCopy"><small>FRONTIER ARRIVAL SIGNATURE</small><b>切換空域景觀</b><span id="transitionFrom"></span><span id="transitionTo"></span><span id="transitionSignature" class="transitionSignature"></span></div></div></div><div id="toast" role="status" aria-live="pol <script>
(() => {
'use strict';
const DESTS={
 AURELIA:{name:'AURELIA ARC｜曙光環域',sub:'人工巨構棲息環 · 固定環域全景',story:'以策展好的單一角度呈現完整棲息環、中央核心與遠方伴星；不再要求玩家旋轉模型尋找正確構圖。',path:'frontier.html',api:'WarpFrontier',vista:'overview',signature:'棲息環鎖定 · 核心燈帶同步'},
 NADIR:{name:'NADIR WELL｜玄淵觀測站',sub:'黑洞前線 · 固定引力井全景',story:'以事件視界、吸積盤、透鏡環與觀測站的固定英雄構圖呈現黑洞前線，避免自由旋轉破壞主視覺。',path:'frontier-nadir.html',api:'WarpFrontierNadir',vista:'overview',signature:'引力透鏡鎖定 · 事件視界穩定'},
 VESPER:{name:'VESPER YARD｜暮環採集場',sub:'氣巨星採集帶 · 固定雲頂主環',story:'以雲頂、工業環與貨運層的固定景觀建立清楚的工業尺度，保留既有場景及高畫質留影。',path:'frontier-vesper.html',api:'WarpFrontierVesper',vista:'overview',signature:'雲頂航標鎖定 · 採集環同步'},
 EIDOLON:{name:'EIDOLON GATE｜遺光門廊',sub:'古文明門廊 · 固定斷環全景',story:'以破碎雙環、殘存光紋與前景遺跡的固定構圖呈現古文明尺度，不再以可旋轉展品方式探索。',path:'frontier-eidolon.html',api:'WarpFrontierEidolon',vista:'overview',signature:'遺跡相位鎖定 · 斷環訊號同步'}
};
const app=document.querySelector('#scenicApp'),frame=document.querySelector('#frontierFrame'),nameEl=document.querySelector('#name'),subEl=document.querySelector('#sub'),storyEl=document.querySelector('#story'),phaseName=document.querySelector('#phaseName'),phaseMeta=document.querySelector('#phaseMeta'),captureButton=document.querySelector('#capture'),route=document.querySelector('#route'),routeButton=document.querySelector('#routeButton'),grid=document.querySelector('#destGrid'),destinationCommit=document.querySelector('#destinationCommit'),destinationCommitName=document.querySelector('#destinationCommitName'),destinationCommitDetail=document.querySelector('#destinationCommitDetail'),toast=document.querySelector('#toast'),transition=document.querySelector('#transition'),transitionFrom=document.querySelector('#transitionFrom'),transitionTo=document.querySelector('#transitionTo'),transitionSignature=document.querySelector('#transitionSignature');
const TEST_MODE=new URLSearchParams(location.search).get('test')==='1',TRANSITION_MS=TEST_MODE?480:780;
let dest='',api=null,timer=0,toastTimer=0,locked=false,switching=false,switchTimer=0,pendingDest='',selectionDest='';
function validDest(value){value=String(value||'').toUpperCase();return DESTS[value]?value:'AURELIA'}
function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
function clearSelection(focus=false){const previous=selectionDest;selectionDest='';destinationCommit.classList.remove('open');destinationCommit.setAttribute('aria-hidden','true');grid.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed','false'));if(focus&&previous)grid.querySelector(`[data-dest="${previous}"]`)?.focus?.()}
function setRoute(open){if(switching)open=false;if(!open)clearSelection(false);route.classList.toggle('open',open);route.setAttribute('aria-hidden',String(!open));routeButton.setAttribute('aria-expanded',String(open));if(open)grid.querySelector('[aria-current="page"]')?.focus?.()}
function stageSelection(id){const next=validDest(id);if(next===dest){setRoute(false);return true}selectionDest=next;const d=DESTS[next];grid.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.dest===next)));destinationCommitName.textContent=d.name;destinationCommitDetail.textContent=`${d.sub} · 確認後進入既有接近、抵達與固定景觀；不建立虛構 LY 或航段。`;destinationCommit.classList.add('open');destinationCommit.setAttribute('aria-hidden','false');destinationCommit.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});document.querySelector('#destinationCommitConfirm')?.focus?.();return true}
function renderGrid(){grid.replaceChildren();let index=0;for(const [id,d] of Object.entries(DESTS)){index+=1;const current=id===dest,b=document.createElement('button');b.type='button';b.dataset.dest=id;b.dataset.order=String(index).padStart(2,'0');b.setAttribute('aria-current',current?'page':'false');b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',`${d.name}，${current?'目前景觀':'選擇目的地'}`);b.innerHTML=`<b>${d.name}</b><span>${d.sub}</span>${current?'<span class="currentMark">目前景觀</span>':''}`;b.addEventListener('click',()=>stageSelection(id));grid.append(b)}}
function childApi(){try{return frame.contentWindow?.[DESTS[dest].api]||null}catch{return null}}
function hideChildUi(){try{const doc=frame.contentDocument;if(!doc||doc.querySelector('#scenicLockStyle'))return;const style=doc.createElement('style');style.id='scenicLockStyle';style.textContent='.ui,.frontierUi,#frontierToast,#nadirToast,#vesperToast,#eidolonToast{display:none!important} canvas{cursor:default!important}';doc.head.append(style)}catch{}}
function finishSwitch(){if(!switching)return;switching=false;pendingDest='';transition.classList.remove('active');transition.setAttribute('aria-hidden','true');transition.removeAttribute('data-signature');routeButton.disabled=false;renderGrid()}
function sync(){api=childApi();if(!api)return;hideChildUi();const state=api.state?.();if(!state)return;const phase=state.phase||'approach';phaseName.textContent=phase==='explore'?'景觀停泊':phase==='arrival'?'抵達構圖':'深空接近';phaseMeta.textContent=phase==='explore'?'單角度固定景觀':phase==='arrival'?'進入英雄構圖':'保持既有接近段';captureButton.disabled=switching||phase!=='explore'||!!state.capturing;if(phase==='explore'&&!locked){api.applyVista?.(DESTS[dest].vista);locked=true}if(phase==='explore'){const live=api.state?.()||state;if(live.autoOrbit){const orbit=frame.contentDocument?.querySelector?.('[id$="Orbit"]');orbit?.click?.();api.applyVista?.(DESTS[dest].vista)}}app.classList.add('ready');if(switching&&pendingDest===dest)finishSwitch()}
function loadDestination(id){dest=validDest(id);locked=false;api=null;clearSelection(false);const d=DESTS[dest];nameEl.textContent=d.name;subEl.textContent=d.sub;storyEl.textContent=d.story;renderGrid();captureButton.disabled=true;app.classList.remove('ready');const url=new URL(location.href);url.searchParams.set('dest',dest);history.replaceState(null,'',url);frame.src=`./${d.path}?scenic=1`;clearInterval(timer);timer=setInterval(sync,200)}
function beginSwitch(next){const from=DESTS[dest],to=DESTS[next];switching=true;pendingDest=next;captureButton.disabled=true;routeButton.disabled=true;setRoute(false);transition.dataset.signature=next;transitionFrom.textContent=`目前：${from.name}`;transitionTo.textContent=`前往：${to.name}`;transitionSignature.textContent=to.signature;transition.classList.add('active');transition.setAttribute('aria-hidden','false');clearTimeout(switchTimer);switchTimer=setTimeout(()=>loadDestination(next),TRANSITION_MS)}
function select(id,withTransition=false){const next=validDest(id);if(switching)return false;if(!dest||!withTransition){loadDestination(next);return true}if(next===dest){setRoute(false);return true}beginSwitch(next);return true}
